/* ── AIに季節のアドバイスをもらう（書き出し → AIチャット → 貼り戻し） ── */
function advPrompt(withAmt){const t=today(),Y=YEAR(),T=totals(),I=loanInfo(),n=nisaStat(),L=[];
  L.push('あなたは日本のFP（ファイナンシャルプランナー）です。下の「わが家の状況」と今日の日付から、これから約3か月の間に「この季節・この状況だから、こうした方がいい」というアドバイスを5〜10件作ってください。');
  L.push('・税制や制度は最新の情報を確認し、不確かなものは入れない。・一般論より、この家庭の状況に合わせた具体的な内容を優先。・すでに表示中のアドバイスと重複しないこと。');
  L.push('出力は、説明なしで JSON の配列だけ（```で囲んでよい）。形式：');
  L.push('[{"id":"英数字の一意ID","from":"MM-DD","to":"MM-DD","lv":"urgent|soon|me|tip","ic":"絵文字1つ","t":"見出し（30字以内）","d":"本文（120字以内）","url":"公式サイトのURL（あれば）","ul":"リンク名"}]');
  L.push('from〜to は表示する期間（月-日）。lv：urgent=急ぎ、soon=もうすぐ、me=わが家向け、tip=季節の豆知識。');
  L.push('');L.push('【今日】'+t);
  S.children.forEach(ch=>{const a=ch.birth?ageAt(ch.birth,t):null;let x='【子ども】'+ch.name+(a!=null?'（'+a+'歳）':'')+(ch.grade?' '+ch.grade:'');const sc=(ch.schools||[]).filter(s=>s.status!=='不合格'&&s.status!=='辞退');if(sc.length)x+=' ／ 受験：'+sc.map(s=>s.name+'['+s.status+(s.result?' 発表'+fmtMD(s.result):'')+(s.payBy?' 手続'+fmtMD(s.payBy):'')+(withAmt&&s.entry?' 入学金'+man(N(s.entry)):'')+']').join('、');L.push(x);});
  const tp=Object.keys(byType()).map(k=>TYPES[k].s);L.push('【持っている口座の種類】'+(tp.length?tp.join('、'):'未登録')+(withAmt&&T.v?' ／ 資産合計 約'+man(T.v):''));
  const mon=S.accounts.filter(a=>N(a.monthly)>0).map(a=>a.name+(withAmt?' '+yen(N(a.monthly)):'')+(a.type==='mochikabu'&&a.rate?'（奨励金'+a.rate+'%）':''));if(mon.length)L.push('【毎月の積立】'+mon.join('、'));
  if(S.accounts.some(a=>a.type.startsWith('nisa')))L.push('【NISA】今年のつみたて投資枠の計画 '+pct(n.planT,1.2e6)+'%使用・生涯枠 '+pct(n.book,1.8e7)+'%使用');
  if(I.mv)L.push('【住宅ローン】'+(S.loan.kind||'')+'・金利'+I.rate+'%'+(I.rates.filter(r=>r.d>t).map(r=>'（'+fmtMD(r.d)+'から'+r.r+'%予定）').join(''))+'・住宅ローン控除は'+(I.ended?I.last+'年分で終了':I.active?'適用中（'+I.last+'年分まで）':'未適用')+(withAmt&&I.bal?' ・残高 約'+man(I.bal):''));
  L.push('【年末調整（'+Y+'年分）】'+((S.nencho[Y]||{}).submit?'提出済み':'未提出'));
  {const fp=furuPrompt(withAmt);if(fp)L.push(fp);}
  if(S.policy.crash)L.push('【わたしの方針】'+S.policy.crash.replace(/\n/g,' '));
  const now=advice().map(a=>a.t);if(now.length)L.push('【すでに表示中のアドバイス】'+now.join(' ／ '));
  return L.join('\n');}
function aiAdv(){const txt=advPrompt(false);openModal('🤖 AIに季節のアドバイスをもらう',`<ol style="padding-left:20px;font-size:13px;line-height:1.9" class="dim"><li><b>「コピー」</b>を押す（わが家の状況と、答えの形式が入ったテキスト）</li><li>Claudeのチャット（TSUMIKIのプロジェクトなど）に貼って送る</li><li>返ってきたJSONを全部コピーして、下の欄に<b>貼り戻す</b></li></ol>
  <label class="row" style="font-size:12.5px;margin:8px 0"><input type="checkbox" id="ai-amt" onchange="$('ai-txt').value=advPrompt(this.checked)"> 金額も入れる（入れないと、口座の種類・期限・割合だけ）</label>
  <textarea class="in" id="ai-txt" readonly style="min-height:150px;font-size:12px">${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button class="btn p" onclick="copyAi()">📋 コピー</button></div>
  <div class="sec-h">返ってきたJSONを貼り戻す</div><textarea class="in" id="ai-back" placeholder='[ {"id":...} ]' style="min-height:110px;font-family:ui-monospace,monospace;font-size:12px"></textarea><div class="fm-act"><button class="btn p" onclick="aiBack()">取り込む</button></div>`);}
function copyAi(){const t=$('ai-txt').value;const ok=()=>toast('コピーしました。Claudeに貼ってください');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{$('ai-txt').select();document.execCommand('copy');ok();});else{$('ai-txt').select();document.execCommand('copy');ok();}}
function parseAdvJSON(raw){let s=String(raw||'').replace(/```(json)?/g,'').trim();const i=s.indexOf('['),j=s.lastIndexOf(']');if(i>=0&&j>i)s=s.slice(i,j+1);let a=JSON.parse(s);if(!Array.isArray(a))a=[a];return a;}
function importAdv(raw){let a;try{a=parseAdvJSON(raw);}catch(e){toast('JSONの形式が正しくありません');return 0;}let n=0;a.forEach(x=>{if(x&&x.id&&x.t&&x.from&&x.to){S.advPack=(S.advPack||[]).filter(y=>y.id!==x.id);S.advPack.push(x);n++;}});save();return n;}
function aiBack(){const n=importAdv(V('ai-back'));if(n){closeModal();toast(n+'件のアドバイスを取り込みました 🔔');go('adv');}}
function addAdvPack(){const n=importAdv(V('advp'));if(n){toast(n+'件を取り込みました');render();}}

/* ── ドラッグ＆ドロップで読み込み（バックアップ・アドバイス・問題を自動判別） ── */
function handleDropText(raw){let s=String(raw||'').replace(/^﻿/,'').replace(/```(json)?/g,'').trim();let d;
  try{d=JSON.parse(s);}catch(e){const i=s.search(/[\[{]/);try{d=JSON.parse(s.slice(i));}catch(e2){toast('JSONとして読めませんでした');return;}}
  if(d&&!Array.isArray(d)&&d.v){loadBackup(JSON.stringify(d));return;}
  const arr=Array.isArray(d)?d:[d];
  if(arr.length&&arr.every(x=>x&&x.from&&x.to&&x.t)){const n=importAdv(JSON.stringify(arr));if(n){toast(n+'件のアドバイスを取り込みました 🔔');go('adv');}return;}
  if(arr.length&&arr.every(x=>x&&x.id&&((x.q&&Array.isArray(x.c))||(x.t&&typeof x.a==='boolean')))){const ids=new Set(allQ().map(q=>q.id));let n=0;arr.forEach(x=>{if(!ids.has(x.id)){S.customQ.push(x);ids.add(x.id);n++;}});save();toast(n+'問を追加しました');render();return;}
  toast('このJSONの種類がわかりませんでした');}
function readDropFile(f){const r=new FileReader();r.onload=()=>handleDropText(String(r.result));r.readAsText(f);}
let _dragN=0;
document.addEventListener('dragenter',e=>{if(!e.dataTransfer)return;e.preventDefault();_dragN++;document.body.classList.add('dragging');});
document.addEventListener('dragover',e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy';});
document.addEventListener('dragleave',e=>{_dragN=Math.max(0,_dragN-1);if(!_dragN)document.body.classList.remove('dragging');});
document.addEventListener('drop',e=>{e.preventDefault();_dragN=0;document.body.classList.remove('dragging');const dt=e.dataTransfer;if(!dt)return;
  if(dt.files&&dt.files.length){readDropFile(dt.files[0]);return;}const txt=dt.getData('text/plain')||dt.getData('text');if(txt)handleDropText(txt);});
function dropZoneHTML(){return `<label class="dropzone">📂 <b>JSONファイルをここにドラッグ</b><span>（どの画面にドロップしてもOK・タップでファイルを選ぶ）<br>バックアップ／アドバイス／問題を自動で見分けて読み込みます</span><input type="file" accept=".json,.txt,application/json,text/plain" style="display:none" onchange="if(this.files[0])readDropFile(this.files[0]);this.value=''"></label>`;}

/* ── 用語の自動リンク・わかりやすく言うと（APEX方式） ── */
let GL_RE=null;
function glInit(){const t=Object.keys(TS.gl).filter(x=>x.length>=2).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));GL_RE=t.length?new RegExp(t.join('|'),'g'):null;}
function gl(html,self){if(!GL_RE)glInit();if(!GL_RE||!html)return html;const seen=new Set(self?[self]:[]);let inSvg=0,inGl=0;
  return String(html).split(/(<[^>]+>)/).map(p=>{if(p.charAt(0)==='<'){if(/^<svg[\s>]/i.test(p))inSvg++;else if(/^<\/svg>/i.test(p))inSvg=Math.max(0,inSvg-1);if(/^<(span|b|a)[^>]*class="gl"/i.test(p))inGl++;return p;}
    if(inSvg)return p;return p.replace(GL_RE,m=>{if(seen.has(m))return m;seen.add(m);return '<span class="gl" data-g="'+m+'">'+m+'</span>';});}).join('');}
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.gl[data-g]');if(g){e.preventDefault();e.stopPropagation();showGl(g.dataset.g);}},true);
let PLN=0;
function plainBox(txt,label,cls,open){const id='pl'+(++PLN);const o=open||S.plainOpen;return `<div class="plw ${cls||''}"><button type="button" class="plainbtn ${o?'open':''}" onclick="tglPlain('${id}',this)">${label} <span class="pa">${o?'▴':'▾'}</span></button><div class="plain ${o?'open':''}" id="${id}">${txt}</div></div>`;}
function tglPlain(id,b){const e=document.getElementById(id);if(!e)return;const o=e.classList.toggle('open');b.classList.toggle('open',o);const pa=b.querySelector('.pa');if(pa)pa.textContent=o?'▴':'▾';}
function plainHTML(pid){const P=(TS.pl||{})[pid];if(!P)return '';return (P.p?plainBox(gl(esc(P.p)),'💡 わかりやすく言うと',''):'')+(P.k?`<div class="tipline">🧠 <b>覚え方</b>　${gl(esc(P.k))}</div>`:'');}
function enhancePlain(root){if(!root)return;root.querySelectorAll('.gram .pbox, .gram .tbox').forEach(bx=>{const isP=bx.classList.contains('pbox');const w=document.createElement('div');w.innerHTML=plainBox(bx.innerHTML,isP?'💡 わかりやすく言うと':'🧩 例えるなら',isP?'':'tt');bx.replaceWith(w.firstChild);});}
function setPlainOpen(v){S.plainOpen=v;save();render();}
