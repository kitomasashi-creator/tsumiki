<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TSUMIKI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a0f1a">
<script>/* 最初の描画の前にテーマを決める（ちらつき防止） */(function(){var t='night';try{var s=JSON.parse(localStorage.getItem('tsumiki.v1')||'null');if(s&&s.theme&&s.theme!=='tree')t=s.theme;}catch(e){}document.documentElement.setAttribute('data-theme',t);if(t!=='night'){var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#e9b949';}})();</script>
<title>TSUMIKI — わが家のお金と知識の積み木</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e9b949%22/%3E%3Crect x=%2210%22 y=%2258%22 width=%2238%22 height=%2230%22 rx=%225%22 fill=%22%231b2436%22/%3E%3Crect x=%2252%22 y=%2258%22 width=%2238%22 height=%2230%22 rx=%225%22 fill=%22%232b4c7e%22/%3E%3Crect x=%2231%22 y=%2222%22 width=%2238%22 height=%2232%22 rx=%225%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f8f6; --surface:#ffffff; --surface2:#f2f2ef; --border:#e4e3de; --border-soft:#efeeea;
  --text:#1b2436; --text-dim:#56606e; --text-muted:#98a0ac;
  --hdr-bg:#1b2436; --hdr-text:#3a2a07;
  --accent:#2b4c7e; --accent-soft:#7f9cc6; --accent-bg:#eef2f9;
  --gold:#c99a2e; --gold-bg:#fcf5e3;
  --green:#2f9e63; --green-bg:#eef8f1; --red:#cf4d47; --red-bg:#fbf2f1;
  --blue:#3d78b0; --blue-bg:#eef4fa; --amber:#c08a1e; --amber-bg:#fdf6e8;
  /* 分野色 */
  --f-nisa:#2f8f5b; --f-nisa-bg:#edf7f1;
  --f-fund:#3d78b0; --f-fund-bg:#eef4fa;
  --f-stock:#7a4fa0; --f-stock-bg:#f4effa;
  --f-tax:#b5452f; --f-tax-bg:#fbefec;
  --f-edu:#c2561b; --f-edu-bg:#fcf1ea;
  --f-house:#0b8fa8; --f-house-bg:#e8f6f9;
  --f-life:#8a6a2a; --f-life-bg:#f8f3e8;
  --f-furu:#c0447a; --f-furu-bg:#fbeef4;
  --r:7px;
}
html{ background:var(--bg); }
body{ background:var(--bg); color:var(--text); font-family:'Noto Sans JP','DM Sans',system-ui,sans-serif; font-size:14px; line-height:1.75; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
button,input,select,textarea{ font-family:inherit; }
.num{ font-family:'DM Sans','Noto Sans JP',sans-serif; font-variant-numeric:tabular-nums; }

/* ══════════ HEADER ══════════ */
#hdr{ flex-shrink:0; background:linear-gradient(90deg,#e9b949 0%,#f3d27f 42%,#f9e9bd 78%,#fdf8ea 100%); padding-top:env(safe-area-inset-top); position:relative; }
#hdr::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:linear-gradient(90deg,var(--accent) 0 70%,var(--gold) 70% 100%); }
.hdr-main{ display:flex; align-items:center; justify-content:space-between; padding:14px 0 14px 22px; gap:12px; }
.hdr-title-block{ display:flex; align-items:center; gap:12px; min-width:0; cursor:pointer; }
.logo{ width:34px; height:34px; flex-shrink:0; }
.hdr-tt{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.hdr-title{ font-family:'DM Sans',sans-serif; font-weight:300; font-size:23px; letter-spacing:.4em; color:var(--hdr-text); line-height:1; }
.hdr-sub-inline{ font-family:'DM Sans',sans-serif; font-weight:400; font-size:10px; letter-spacing:.22em; color:var(--hdr-text); line-height:1; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hdr-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; padding-right:16px; }
.hdr-icon-btn{ border:1px solid rgba(58,42,7,.25); color:var(--hdr-text); background:rgba(255,255,255,.4); height:32px; padding:0 12px; border-radius:5px; cursor:pointer; font-size:11px; display:flex; align-items:center; gap:5px; -webkit-tap-highlight-color:transparent; }
.hdr-icon-btn:hover{ background:rgba(255,255,255,.75); }
.rank-pill{ font-size:11px; color:var(--hdr-text); border:1px solid rgba(58,42,7,.25); background:rgba(255,255,255,.45); border-radius:20px; padding:4px 11px; white-space:nowrap; cursor:pointer; }
.hdr-icon-btn .badge{ background:var(--red); color:#fff; border-radius:9px; font-size:10px; padding:0 6px; line-height:16px; font-weight:700; }

/* ══════════ LAYOUT ══════════ */
#app{ flex:1; display:flex; overflow:hidden; position:relative; }
#sb{ width:290px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.sb-scroll{ flex:1; overflow-y:auto; padding:6px 0 24px; }
.sb-nav{ padding:12px 12px 10px; border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.navbtn{ display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface2); color:var(--text-dim); font-size:12px; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; }
.navbtn:hover{ border-color:var(--accent-soft); color:var(--accent); }
.navbtn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
.grp-lbl{ padding:14px 20px 4px; font-size:10px; font-weight:700; letter-spacing:.12em; display:flex; align-items:center; gap:6px; color:var(--text-dim); }
.grp-lbl .gn{ margin-left:auto; color:var(--text-muted); font-weight:500; }
.ubtn{ display:flex; align-items:center; width:100%; padding:6px 20px; gap:9px; background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:12.5px; text-align:left; -webkit-tap-highlight-color:transparent; border-left:3px solid transparent; }
.ubtn:hover{ background:var(--surface2); color:var(--text); }
.ubtn.active{ background:var(--accent-bg); color:var(--accent); border-left-color:var(--accent); font-weight:500; }
.ubtn .uicon{ font-size:15px; width:20px; text-align:center; flex-shrink:0; }
.ubtn .utxt{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.ubtn .ut-main{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ubtn .ut-sub{ font-size:10px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.umeter{ width:38px; flex-shrink:0; font-size:10px; color:var(--text-muted); text-align:right; font-family:'DM Sans',sans-serif; }
.umeter.good{ color:var(--green); font-weight:600; }
#main{ flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); min-width:0; }
#crumb{ display:none; flex-shrink:0; align-items:center; gap:10px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
#crumb .back{ color:var(--accent); font-size:13px; cursor:pointer; background:none; border:none; padding:4px 0; }
#crumb .ct{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#content{ flex:1; overflow-y:auto; padding:32px 44px 96px; -webkit-overflow-scrolling:touch; }

/* ══════════ 共通部品 ══════════ */
h2.pg{ font-size:19px; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pg-sub{ color:var(--text-muted); font-size:12.5px; margin-bottom:22px; }
.sec-h{ font-size:11px; font-weight:700; color:var(--accent); margin:28px 0 12px; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
.sec-h::before{ content:""; width:16px; height:2px; background:var(--gold); border-radius:2px; }
.sec-h .r{ margin-left:auto; }
.wrap{ max-width:820px; }
.btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:var(--r); border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12.5px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
.btn:hover{ border-color:var(--accent); color:var(--accent); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.p{ background:var(--hdr-bg); border-color:var(--hdr-bg); color:#fff; font-weight:500; }
.btn.p:hover{ background:var(--accent); border-color:var(--accent); }
.btn.g{ background:var(--gold); border-color:var(--gold); color:#fff; font-weight:600; }
.btn.sm{ padding:6px 12px; font-size:11.5px; }
.btn.xs{ padding:3px 9px; font-size:11px; }
.btn.danger:hover{ border-color:var(--red); color:var(--red); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.chip{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; letter-spacing:.03em; white-space:nowrap; }
.chip.nisa{ background:var(--f-nisa-bg); color:var(--f-nisa); }
.chip.fund{ background:var(--f-fund-bg); color:var(--f-fund); }
.chip.stock{ background:var(--f-stock-bg); color:var(--f-stock); }
.chip.tax{ background:var(--f-tax-bg); color:var(--f-tax); }
.chip.edu{ background:var(--f-edu-bg); color:var(--f-edu); }
.chip.house{ background:var(--f-house-bg); color:var(--f-house); }
.chip.life{ background:var(--f-life-bg); color:var(--f-life); }
.chip.furu{ background:var(--f-furu-bg); color:var(--f-furu); }
.chip.me{ background:var(--gold-bg); color:#8a6510; }
.chip.gray{ background:var(--surface2); color:var(--text-muted); }
.chip.ok{ background:var(--green-bg); color:var(--green); } .chip.ng{ background:var(--red-bg); color:var(--red); } .chip.warn{ background:var(--amber-bg); color:#8a6510; }
.empty{ background:var(--surface); border:1px dashed var(--border); border-radius:var(--r); padding:22px; color:var(--text-muted); font-size:13px; text-align:center; line-height:1.9; }
.seg{ display:inline-flex; border:1px solid var(--border); border-radius:var(--r); overflow:hidden; background:var(--surface); flex-wrap:wrap; }
.seg button{ border:none; background:none; padding:7px 13px; font-size:12px; color:var(--text-dim); cursor:pointer; border-right:1px solid var(--border); }
.seg button:last-child{ border-right:none; }
.seg button.on{ background:var(--accent); color:#fff; }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
.card h4{ font-size:14px; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.muted{ color:var(--text-muted); font-size:12px; }
.dim{ color:var(--text-dim); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }

/* ══════════ フォーム ══════════ */
.fm{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px 12px; }
.fm label{ display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--text-dim); font-weight:600; }
.fm label.w2{ grid-column:span 2; } .fm label.full{ grid-column:1/-1; }
.in{ width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13.5px; background:var(--surface); color:var(--text); outline:none; }
.in:focus{ border-color:var(--accent); }
textarea.in{ min-height:80px; resize:vertical; line-height:1.7; }
.fm-act{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }

/* ══════════ HOME ══════════ */
.hero{ background:var(--hdr-bg); color:#eef1f5; border-radius:12px; padding:20px 22px; margin-bottom:14px; display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:14px; position:relative; overflow:hidden; }
.hero::after{ content:""; position:absolute; right:-30px; bottom:-30px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle,rgba(233,185,73,.25),transparent 70%); }
.kpi .k-l{ font-size:10.5px; opacity:.6; letter-spacing:.06em; }
.kpi .k-v{ font-family:'DM Sans',sans-serif; font-size:24px; font-weight:300; line-height:1.3; }
.kpi .k-v small{ font-size:11px; opacity:.6; margin-left:2px; }
.kpi .k-s{ font-size:10.5px; opacity:.55; }
.kpi.big .k-v{ font-size:30px; color:#f3d27f; }
.daily{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--gold); border-radius:var(--r); padding:14px 18px; margin-bottom:12px; cursor:pointer; }
.daily .dl{ font-size:10.5px; font-weight:700; color:#8a6510; letter-spacing:.1em; }
.daily .dq{ font-size:14px; margin-top:4px; }
.promise{ background:var(--accent-bg); border:1px solid #d7e0ee; border-radius:var(--r); padding:12px 16px; margin-bottom:12px; font-size:13.5px; }
.promise .dl{ font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.1em; }
.mode-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.mode-card{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:15px 17px; cursor:pointer; -webkit-tap-highlight-color:transparent; font-size:14px; color:var(--text); display:flex; flex-direction:column; align-items:flex-start; transition:all .15s; position:relative; }
.mode-card:hover:not(:disabled){ border-color:var(--accent); box-shadow:0 3px 12px rgba(43,76,126,.08); transform:translateY(-1px); }
.mode-card:disabled{ opacity:.5; cursor:default; }
.mode-card.me{ border-color:#eedba6; background:linear-gradient(180deg,#fdf8ea,#fff); }
.mode-card.due{ border-color:#d7e0ee; background:linear-gradient(180deg,#f4f7fc,#fff); }
.mode-card .cnt{ position:absolute; top:12px; right:12px; font-size:11px; font-weight:700; color:#fff; background:var(--red); border-radius:10px; padding:0 8px; }
.mode-ic{ font-size:22px; }
.mode-name{ font-size:14.5px; font-weight:600; margin:6px 0 3px; }
.mode-desc{ font-size:11.5px; color:var(--text-muted); line-height:1.6; }
.ev-list{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }
.ev{ display:flex; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border-soft); font-size:13px; }
.ev:last-child{ border-bottom:none; }
.ev .ev-d{ width:58px; flex-shrink:0; text-align:center; line-height:1.2; }
.ev .ev-d b{ display:block; font-size:16px; font-family:'DM Sans',sans-serif; font-weight:500; }
.ev .ev-d span{ font-size:10px; color:var(--text-muted); }
.ev .ev-m{ flex:1; min-width:0; }
.ev .ev-t{ font-weight:500; }
.ev .ev-s{ font-size:11.5px; color:var(--text-muted); }
.ev .ev-c{ font-size:11px; font-weight:700; white-space:nowrap; font-family:'DM Sans','Noto Sans JP',sans-serif; }
.ev .ev-c.soon{ color:var(--red); } .ev .ev-c.mid{ color:#8a6510; } .ev .ev-c.far{ color:var(--text-muted); }
.ev.done{ opacity:.45; } .ev.done .ev-t{ text-decoration:line-through; }
.ev .ck2{ width:22px; height:22px; border-radius:6px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; flex-shrink:0; font-size:12px; color:#fff; }
.ev.done .ck2{ background:var(--green); border-color:var(--green); }
.fbars{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 18px; }
.fbar{ display:grid; grid-template-columns:150px 1fr 70px; gap:10px; align-items:center; margin:6px 0; font-size:12.5px; }
.fbar .tr{ height:9px; background:var(--surface2); border-radius:5px; overflow:hidden; }
.fbar .fl{ height:100%; border-radius:5px; }
.fbar .v{ text-align:right; font-family:'DM Sans',sans-serif; color:var(--text-dim); font-size:12px; }

/* 積み木タワー（ランク） */
.tower{ display:flex; flex-direction:column-reverse; align-items:center; gap:3px; min-height:120px; justify-content:flex-start; }
.tower i{ display:block; height:13px; border-radius:3px; }
.rankcard{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 20px; margin-bottom:12px; display:flex; gap:18px; align-items:center; }
.rankcard .rk-main{ flex:1; min-width:0; }
.rankcard .rk-l{ font-size:10.5px; letter-spacing:.14em; color:var(--text-muted); font-family:'DM Sans',sans-serif; }
.rankcard .rk-n{ font-size:17px; font-weight:600; margin:2px 0 8px; }
.rankcard .rk-bar{ height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.rankcard .rk-fill{ height:100%; background:linear-gradient(90deg,var(--accent-soft),var(--gold)); border-radius:3px; }
.rankcard .rk-next{ font-size:11px; color:var(--text-muted); margin-top:6px; }

/* ══════════ 解説 ══════════ */
.tabs{ display:flex; border-bottom:1px solid var(--border); margin:4px 0 22px; overflow-x:auto; }
.tab{ padding:11px 16px; font-size:13px; color:var(--text-muted); cursor:pointer; border:none; background:none; border-bottom:2px solid transparent; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
.tab.on{ color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
.gram{ max-width:780px; }
.gram h3{ font-size:12px; font-weight:700; color:var(--accent); margin:30px 0 14px; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
.gram h3::before{ content:""; width:16px; height:2px; background:var(--gold); border-radius:2px; }
.gram h3:first-child{ margin-top:0; }
.gram p{ color:var(--text-dim); margin-bottom:12px; font-size:14px; line-height:1.9; }
.gram strong{ color:var(--text); }
.gram ul,.gram ol{ margin:0 0 14px; padding-left:20px; }
.gram li{ color:var(--text-dim); margin-bottom:6px; line-height:1.85; }
.gram table{ width:100%; border-collapse:collapse; margin:12px 0 20px; font-size:13px; background:var(--surface); border:1px solid var(--border); }
.gram th{ text-align:left; padding:9px 12px; background:var(--surface2); color:var(--text-dim); font-size:11px; font-weight:600; border-bottom:1px solid var(--border); }
.gram td{ padding:9px 12px; border-bottom:1px solid var(--border-soft); color:var(--text); vertical-align:top; }
.gram td:first-child{ color:var(--accent); font-weight:500; }
.tblwrap{ overflow-x:auto; }
.pbox,.tbox,.mbox{ border-radius:var(--r); padding:12px 16px; margin:14px 0 20px; font-size:13.5px; line-height:1.95; }
.pbox{ background:var(--amber-bg); border:1px solid #f0e2c0; color:#5e4a1c; }
.tbox{ background:var(--accent-bg); border:1px solid #d7e0ee; color:var(--text); }
.mbox{ background:var(--gold-bg); border:1px solid #eedba6; color:var(--text); }
.pbox::before,.tbox::before,.mbox::before{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.06em; margin-bottom:3px; }
.pbox::before{ content:"💡 わかりやすく言うと"; color:#8a6510; }
.tbox::before{ content:"🧩 例えるなら"; color:var(--accent); }
.mbox::before{ content:"🏠 わが家の場合"; color:#8a6510; }
.wbox{ background:var(--red-bg); border:1px solid #f0d3d0; border-radius:var(--r); padding:12px 16px; margin:12px 0; font-size:12.5px; color:#8f3430; line-height:1.85; }
.nbox{ background:var(--blue-bg); border:1px solid #d6e4f0; border-radius:var(--r); padding:12px 16px; margin:12px 0; font-size:12.5px; color:var(--blue); line-height:1.85; }
.newbox{ background:#f1f8ee; border:1px solid #cfe6c3; border-radius:var(--r); padding:12px 16px; margin:12px 0 18px; font-size:13px; color:#2e5a1d; line-height:1.85; }
.newbox::before{ content:"🆕 2026年の改正ポイント"; display:block; font-size:11.5px; font-weight:700; margin-bottom:3px; }
.gl{ text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--accent); text-decoration-thickness:1.5px; text-underline-offset:3px; cursor:pointer; }
.gl:hover{ color:var(--accent); background:var(--accent-bg); }
.unit-foot{ margin-top:28px; padding-top:18px; border-top:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; }

/* ══════════ 問題 ══════════ */
.qprog{ display:flex; align-items:center; gap:14px; margin-bottom:18px; max-width:760px; }
.qtrack{ flex:1; height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; }
.qfill{ height:100%; background:var(--accent); transition:width .3s; }
.qlbl{ font-size:11px; color:var(--text-muted); white-space:nowrap; font-family:'DM Sans',sans-serif; }
.qcard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px 24px; margin-bottom:14px; max-width:760px; }
.qmeta{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.qmeta .src{ font-size:11px; color:var(--text-muted); }

.result-badge{ text-align:center; padding:24px 20px; border-radius:var(--r); margin-bottom:18px; max-width:760px; }

.result-badge.fail{ background:var(--red-bg); border:1px solid rgba(207,77,71,.4); }

.rev-item{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--r); padding:10px 14px; margin-bottom:8px; font-size:13px; max-width:760px; }

/* ══════════ お金 ══════════ */

.pl-p{ color:var(--green); } .pl-m{ color:var(--red); }

.chart{ position:relative; }

table.tb{ width:100%; border-collapse:collapse; font-size:12.5px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }

.ckl{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }
.ckl .it{ display:flex; gap:12px; padding:11px 14px; border-bottom:1px solid var(--border-soft); cursor:pointer; align-items:flex-start; -webkit-tap-highlight-color:transparent; }
.ckl .it:last-child{ border-bottom:none; }
.ckl .bx{ width:22px; height:22px; border-radius:6px; border:1.5px solid var(--border); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; }
.ckl .it.on .bx{ background:var(--green); border-color:var(--green); }

.stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 14px; }

.stat .v{ font-size:21px; font-family:'DM Sans','Noto Sans JP',sans-serif; font-weight:400; line-height:1.3; }
.stat .v small{ font-size:11px; color:var(--text-muted); }
.stat .s{ font-size:11px; color:var(--text-muted); }
.stat.hl{ border-color:#eedba6; background:var(--gold-bg); }
.school{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 14px; margin-bottom:8px; }
.school .sh{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

.school .sd{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:4px 12px; font-size:12px; color:var(--text-dim); margin-top:6px; }
.school .sd b{ color:var(--text); font-weight:500; }
.st-sel{ font-size:11.5px; padding:3px 6px; border-radius:5px; border:1px solid var(--border); background:var(--surface); }
.gsearch{ width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--r); font-size:14px; background:var(--surface); outline:none; }
.gl-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
.gl-item{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:10px 14px; cursor:pointer; font-size:13.5px; color:var(--text); }
.gl-item:hover{ border-color:var(--accent); }
.gl-item .gd{ font-size:11.5px; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:2px; line-height:1.6; }
.imp-msg{ font-size:12.5px; margin-top:10px; white-space:pre-wrap; }
.imp-msg.err{ color:var(--red); } .imp-msg.ok{ color:var(--green); }

/* ══════════ MODAL / TOAST ══════════ */
#modal{ position:fixed; inset:0; background:rgba(15,18,28,.55); display:none; align-items:center; justify-content:center; z-index:200; padding:16px; }
#modal.show{ display:flex; animation:fadein .15s ease; }
.modal-box{ background:var(--surface); border-radius:14px; max-width:680px; width:100%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(0,0,0,.32); overflow:hidden; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 18px; border-bottom:1px solid var(--border); }
.modal-title{ font-size:14px; font-weight:600; color:var(--accent); }
.modal-close{ width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:15px; cursor:pointer; flex-shrink:0; }
.modal-body{ padding:18px 20px 22px; overflow-y:auto; }

#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ══════════ スマホ（iPhone Air） ══════════ */
#tabbar{ display:none; }
button,.choice,.ox-b,.gl{ touch-action:manipulation; }

  #crumb.nob .back{ display:none; } #crumb.hide{ display:none; }

  .ubtn{ padding:10px 18px; font-size:14px; } .ubtn .ut-sub{ font-size:11px; }
  .grp-lbl{ padding:18px 18px 6px; font-size:11px; }

  .mode-card{ padding:13px; } .mode-name{ font-size:14px; } .mode-desc{ font-size:11px; }
  .fbar{ grid-template-columns:1fr auto; row-gap:4px; margin:10px 0; }
  .fbar > span:first-child{ grid-column:1/-1; }
  .grid2,.grid3{ grid-template-columns:1fr; }
  .stat3{ grid-template-columns:1fr 1fr; }
  .fm{ grid-template-columns:1fr 1fr; } .fm label.w2{ grid-column:1/-1; }
  .in,.gsearch{ font-size:16px; }
  .acc{ grid-template-columns:5px 1fr; } .acc .a-v{ grid-column:2; text-align:left; } .acc .a-act{ grid-column:2; }
  table.tb{ font-size:12px; } table.tb th,table.tb td{ padding:7px 7px; }
  .modal-box{ max-height:92dvh; border-radius:14px 14px 0 0; }
  #modal{ align-items:flex-end; padding:0; } #modal .modal-box{ max-width:100%; }
  .modal-body{ padding:16px 16px calc(22px + env(safe-area-inset-bottom)); }

    background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--border);
    padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right)); }

  #tabbar button .ti{ font-size:20px; line-height:1.1; filter:grayscale(1); opacity:.7; }

}
@media print{ #hdr,#sb,#tabbar,#crumb{ display:none !important; } body{ height:auto; overflow:visible; } #content{ overflow:visible; } }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:#d9d7d0; border-radius:4px; }
/* ══════════ HERO（両テーマ共通の骨格） ══════════ */
:root{ --hero-a:#1b2436; --hero-b:#2b4c7e; --hero-acc:#f3d27f; --font-digi:'DM Sans','Noto Sans JP',sans-serif; }
.hm-hero{ position:relative; border-radius:16px; overflow:hidden; background:linear-gradient(135deg,var(--hero-a),var(--hero-b)); color:#fff; padding:22px 22px 18px; margin-bottom:14px; box-shadow:0 6px 20px rgba(0,0,0,.18); min-height:210px; }
.hm-hero svg.hm-bg{ position:absolute; right:-10px; top:0; height:100%; width:auto; color:var(--hero-acc); opacity:.5; pointer-events:none; }
.hm-ht{ position:relative; }
.hm-big{ font-family:var(--font-digi); font-weight:900; letter-spacing:.16em; font-size:clamp(30px,7vw,54px); line-height:1; }
.hm-big i{ font-style:normal; color:var(--hero-acc); }
.hm-sub{ font-size:11px; letter-spacing:.16em; opacity:.75; margin-top:8px; }
.hm-date{ font-family:var(--font-digi); font-size:12px; letter-spacing:.12em; opacity:.7; margin-top:12px; }
.hm-stat{ position:relative; display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:10px; margin-top:18px; }
.hm-stat>div{ cursor:pointer; min-width:0; }
.hm-stat .l{ font-size:10px; letter-spacing:.1em; opacity:.65; white-space:nowrap; }
.hm-stat b{ display:block; font-family:var(--font-digi); font-size:24px; line-height:1.15; color:var(--hero-acc); font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.hm-stat b small{ font-size:11px; opacity:.7; margin-left:2px; font-weight:500; }
.hm-stat .s{ font-size:10.5px; opacity:.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hm-stat .big b{ font-size:30px; }
@media (min-width:641px){ .hm-stat{ max-width:74%; } }
@media (max-width:640px){
  .hm-hero{ padding:18px 16px 16px; min-height:0; border-radius:14px; }
  .hm-hero svg.hm-bg{ opacity:.28; }
  .hm-stat{ grid-template-columns:1fr 1fr 1fr; gap:12px 8px; }
  .hm-stat .big{ grid-column:1/-1; }
  .hm-stat b{ font-size:22px; } .hm-stat .big b{ font-size:34px; }
}

/* ══════════ いまやること（アラート） ══════════ */
.adv{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.adv-h{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; margin:4px 0 2px; }
.adv-h .bar{ width:4px; height:18px; background:var(--accent); border-radius:2px; }
.adv-h .r{ margin-left:auto; font-size:11.5px; font-weight:500; color:var(--text-muted); }
.adv-i{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; background:var(--surface); border:1px solid var(--border); border-left:5px solid var(--text-muted); border-radius:10px; padding:12px 14px; }
.adv-i.urgent{ border-left-color:var(--red); } .adv-i.soon{ border-left-color:var(--amber); } .adv-i.tip{ border-left-color:var(--accent); } .adv-i.me{ border-left-color:var(--gold); }
.adv-ic{ font-size:22px; grid-row:span 2; line-height:1.2; }
.adv-t{ font-weight:700; font-size:14px; line-height:1.5; }
.adv-t .lv{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; padding:1px 7px; border-radius:4px; margin-right:6px; vertical-align:2px; }
.adv-i.urgent .lv{ background:var(--red); color:#fff; } .adv-i.soon .lv{ background:var(--amber); color:#1b1b1b; } .adv-i.tip .lv{ background:var(--accent); color:var(--on-accent,#fff); } .adv-i.me .lv{ background:var(--gold); color:#1b1b1b; }
.adv-d{ font-size:12.5px; color:var(--text-dim); line-height:1.75; }
.adv-a{ grid-column:2; display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.adv-a a.btn{ text-decoration:none; }

/* ══════════ 一問一答 ══════════ */
.ichi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px 20px; max-width:760px; }
.ichi-q{ font-size:13px; color:var(--text-dim); line-height:1.7; }
.ichi-q b{ display:inline-block; font-size:10px; letter-spacing:.1em; background:var(--surface2); color:var(--text-muted); padding:1px 7px; border-radius:4px; margin-right:6px; }
.ichi-a{ font-size:19px; font-weight:800; margin-top:10px; line-height:1.6; }
.ichi-a::before{ content:"→ "; color:var(--accent); }
.ichi-t{ font-size:17px; font-weight:700; line-height:1.75; }
.ichi-btns{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; max-width:760px; }
.ichi-btns button{ height:84px; font-size:34px; font-weight:900; border-radius:14px; border:1px solid var(--border); background:var(--surface); cursor:pointer; -webkit-tap-highlight-color:transparent; }
.ichi-btns .o{ color:var(--green); } .ichi-btns .x{ color:var(--red); }
.ichi-btns button.hit{ outline:3px solid currentColor; }
.ichi-btns button:disabled{ cursor:default; }
.ichi-top{ display:flex; gap:10px; align-items:center; margin-bottom:12px; max-width:760px; }
.ichi-score{ font-family:var(--font-digi); font-size:13px; color:var(--text-muted); margin-left:auto; }

/* ══════════ NIGHT テーマ（ミッドナイトネイビー × シャンパンゴールド） ══════════ */
html[data-theme="night"]{
  --bg:#0d1321; --surface:#151d2e; --surface2:#1e2840; --border:#2c3a55; --border-soft:#1f2a40;
  --text:#eef2f8; --text-dim:#c3cbe0; --text-muted:#7d8aa8;
  --hdr-bg:#0a0f1a; --hdr-text:#eef2f8;
  --accent:#e8c46a; --accent-soft:#9c8340; --accent-bg:rgba(232,196,106,.10); --on-accent:#0d1321;
  --gold:#e8c46a; --gold-bg:rgba(232,196,106,.08);
  --green:#4ade80; --green-bg:rgba(74,222,128,.10); --red:#f87171; --red-bg:rgba(248,113,113,.10);
  --blue:#60a5fa; --blue-bg:rgba(96,165,250,.10); --amber:#fbbf24; --amber-bg:rgba(251,191,36,.10);
  --f-nisa:#4ade80; --f-nisa-bg:rgba(74,222,128,.12);
  --f-fund:#60a5fa; --f-fund-bg:rgba(96,165,250,.12);

<script>
/* ── TSUMIKI 学習コンテンツ（2026年11月時点の制度で作成） ── */
window.TS=window.TS||{};
TS.VERSION_NOTE='制度の内容は2026年11月時点（令和8年度税制改正を反映）。毎年の改正で数字が変わるため、最終確認は会社・金融機関・国税庁などの案内で。';
TS.FIELDS={
  nisa:{n:'NISA',ic:'🌱',col:'var(--f-nisa)'},
  fund:{n:'投資信託',ic:'📈',col:'var(--f-fund)'},
  stock:{n:'持株会・株式',ic:'🏭',col:'var(--f-stock)'},
  tax:{n:'年末調整・税金',ic:'🧾',col:'var(--f-tax)'},
  edu:{n:'教育資金・大学',ic:'🎓',col:'var(--f-edu)'},
  house:{n:'住宅ローン',ic:'🏠',col:'var(--f-house)'},
  life:{n:'年金・保険・iDeCo',ic:'🛟',col:'var(--f-life)'}
};
TS.units=[
{ id:'nisa1', field:'nisa', icon:'🌱', title:'NISAのしくみ', sub:'2つの枠・生涯1,800万円・枠の復活', gram:`
<h3>まず、これは何？</h3>
<p>[[NISA]]は、投資で得た利益（売却益・分配金・配当）に<strong>税金がかからない</strong>口座です。ふつうの口座なら利益の<strong>20.315%</strong>が税金で引かれますが、NISAの中なら0%です。2024年から今の制度になり、期限のない「一生使える制度」になりました。</p>
<div class="pbox">利益に税金がかからない「特別な財布」。財布に入れられる金額には、1年ごとの上限と、一生ぶんの上限がある。</div>
<h3>2つの枠と上限</h3>
<div class="tblwrap"><table><thead><tr><th></th><th>つみたて投資枠</th><th>成長投資枠</th></tr></thead><tbody>
<tr><td>1年の上限</td><td>120万円</td><td>240万円</td></tr>
<tr><td>買えるもの</td><td>国の基準を満たした長期・積立向きの投資信託</td><td>上場株式・投資信託など（毎月分配型や高レバレッジ型などは除外）</td></tr>
<tr><td>買い方</td><td>積立のみ</td><td>一括でも積立でも</td></tr>
<tr><td>生涯の上限</td><td colspan="2">合計1,800万円（うち成長投資枠は1,200万円まで）</td></tr>
</tbody></table></div>
<p>2つの枠は<strong>併用できる</strong>ので、1年で最大360万円まで投資できます。非課税で持っていられる期間は<strong>無期限</strong>です。</p>
<h3>生涯枠は「買った値段」で数える</h3>
<p>生涯1,800万円は、今の評価額ではなく<strong>買ったときの金額（簿価）</strong>で管理します。たとえば100万円で買った投資信託が150万円に増えても、枠の使用は100万円のままです。</p>
<p>売ると、その<strong>簿価の分だけ枠が翌年に復活</strong>します。ただし1年の上限（360万円）は変わらないので、復活した枠を一気に使えるわけではありません。</p>
<div class="tbox">ダムの貯水量（生涯枠）は「入れた水の量」で数える。水が増えても（値上がり）使用量は増えない。水を抜くと（売却）、翌年からまた入れられる。ただし1年に流し込める量（年間枠）は決まっている。</div>
<h3>ここで間違えやすい</h3>
<ul>
<li>NISAの中で出た<strong>損失は、ほかの口座の利益と相殺（[[損益通算]]）できない</strong>。繰り越しもできない。</li>
<li>口座は<strong>1人1つ</strong>。金融機関を変えるのは1年ごと。</li>
<li>口座を開けるのは、その年の<strong>1月1日時点で18歳以上</strong>の人。</li>
<li>その年の枠は<strong>その年の買付（約定）分</strong>。12月の最終週に注文すると約定が翌年になることがある。</li>
</ul>
<div class="mbox">毎月の積立額 × 12 が、その年の枠の使い方の目安。「お金」タブのNISA画面で、今年の枠と生涯枠の残りをいつでも確認できます。</div>
` },
{ id:'nisa2', field:'nisa', icon:'👨‍👦', title:'家族のNISAとこどもNISA', sub:'18歳からの口座・2027年からの新制度', gram:`
<h3>子どもは18歳になったら自分のNISA</h3>
<p>NISA口座は、その年の1月1日時点で18歳以上なら開けます。大学生になった子どもが<strong>自分名義のNISA</strong>を持つことは可能です。ただし、口座の中身は<strong>子ども本人のお金</strong>です。親のお金を入れれば「親から子への贈与」になります。</p>
<div class="pbox">親が子の名前を借りて運用する「名義だけの口座」はダメ。お金をあげるなら、あげたことが分かるように（振込記録など）して、子ども自身が管理する。</div>
<h3>贈与税の基本</h3>
<p>1人が1年間（1月〜12月）にもらった額が<strong>110万円以下</strong>なら、贈与税はかかりません（[[暦年贈与]]の基礎控除）。また、<strong>必要なつど払う教育費や生活費</strong>は、そもそも贈与税がかかりません。入学金や授業料を親が直接払うのは問題ありません。</p>
<h3>こどもNISA（2027年1月から）</h3>
<p>令和8年度の税制改正で、<strong>0〜17歳</strong>も使える「こどもNISA」をつくることが決まりました（2027年1月開始の予定）。</p>
<div class="tblwrap"><table><thead><tr><th>項目</th><th>こどもNISA（予定）</th></tr></thead><tbody>
<tr><td>対象</td><td>0〜17歳（親などが管理）</td></tr>
<tr><td>買えるもの</td><td>つみたて投資枠と同じ投資信託・積立のみ</td></tr>
<tr><td>上限</td><td>年60万円・合計600万円</td></tr>
<tr><td>払い出し</td><td>子が12歳以降なら、一定の条件で可能</td></tr>
<tr><td>18歳になると</td><td>大人のNISAへ自動で移る</td></tr>
</tbody></table></div>
<div class="newbox">こどもNISAは2027年1月から始まる予定。詳しい手続きは、金融機関の案内が出てから確認する。</div>
<div class="mbox">高校生の子どもは、18歳になる年の翌年1月から大人のNISAの対象になります。大学進学後、アルバイト代の一部で積立を始めるのも、お金の教育になります。</div>
` },
{ id:'fund1', field:'fund', icon:'📈', title:'投資信託のしくみとコスト', sub:'基準価額・信託報酬・分配金', gram:`
<h3>まず、これは何？</h3>
<p>[[投資信託]]は、たくさんの人から集めたお金を、専門家がまとめて株や債券に投資する商品です。少額で多くの会社に<strong>分散投資</strong>できるのが強みです。</p>
<div class="tbox">みんなでお金を出し合って買う「詰め合わせパック」。1パックの中に数千社の株が少しずつ入っている。</div>
<h3>値段＝基準価額</h3>
<p>投資信託の値段は[[基準価額]]といい、ふつう<strong>1万口あたり</strong>の価格で表します。1日に1回だけ決まります。注文した時点では値段が分からない「ブラインド方式」で、海外の株を買う投資信託は、注文の翌営業日の基準価額で約定するのがふつうです。</p>
<h3>3つのコスト</h3>
<div class="tblwrap"><table><thead><tr><th>コスト</th><th>いつ</th><th>ポイント</th></tr></thead><tbody>
<tr><td>購入時手数料</td><td>買うとき</td><td>無料（ノーロード）のものが多い</td></tr>
<tr><td>[[信託報酬]]</td><td>持っている間ずっと</td><td>毎日少しずつ差し引かれる。長期では最も効く</td></tr>
<tr><td>信託財産留保額</td><td>売るとき</td><td>かからない商品も多い</td></tr>
</tbody></table></div>
<p>信託報酬は年率で表示されますが、<strong>基準価額からすでに引かれた状態</strong>で値段が出ています。請求書は来ないので気づきにくいコストです。</p>
<h3>インデックスとアクティブ</h3>
<p><strong>インデックス型</strong>は、日経平均や全世界株式などの指数と同じ動きを目指します。コストが低いのが特徴です。<strong>アクティブ型</strong>は指数を上回ることを目指しますが、コストが高めで、長期で指数に勝ち続けるものは多くありません。</p>
<h3>分配金の正体</h3>
<p>[[分配金]]は、投資信託の財産から払い出されるお金です。払った分だけ基準価額が下がります。利益から出る<strong>普通分配金</strong>には税金がかかり、元本の取り崩しにあたる<strong>元本払戻金（特別分配金）</strong>には税金がかかりません。</p>
<div class="pbox">分配金は「おまけ」ではなく、自分の財布の中身を出しているだけ。増やしたい期間は、分配金を出さない（または再投資する）商品のほうが複利が効く。</div>
<h3>税金と口座</h3>
<p>NISA以外の口座で出た利益には<strong>20.315%</strong>（所得税15.315%＋住民税5%）がかかります。[[特定口座]]の「源泉徴収あり」を選べば、証券会社が税金を計算して納めるので、原則として確定申告は要りません。</p>
` },
{ id:'fund2', field:'fund', icon:'🧭', title:'積立を続けるコツ', sub:'ドルコスト・複利・リバランス・暴落時', gram:`
<h3>ドルコスト平均法</h3>
<p>毎月同じ金額で買い続けると、値段が高いときは少なく、安いときは多く買えます。これを[[ドルコスト平均法]]といいます。買う時期を考えなくていいので、気持ちが楽になるのが最大の効果です。</p>
<div class="pbox">安いときにたくさん、高いときに少しだけ。「いつ買うか」の悩みを、自動で平らにしてくれる方法。</div>
<h3>複利と72の法則</h3>
<p>利益をそのまま再投資すると、利益が利益を生みます（[[複利]]）。お金が2倍になる年数の目安は<strong>72÷年利（%）</strong>です。年3%なら約24年、年6%なら約12年です。</p>
<h3>リバランス</h3>
<p>株と債券などの割合は、値動きでだんだんずれていきます。決めた割合に戻すことを[[リバランス]]といいます。年に1回など、<strong>日を決めて機械的に</strong>行うのがコツです。NISAの中で売ると枠の再利用は翌年になるので、<strong>積立の配分を変えて調整する</strong>方法もあります。</p>
<h3>暴落したとき</h3>
<p>株式は、数年に一度は大きく下がります。長期の積立では、下がったときにやめてしまうのが一番もったいない行動です。下がっている時期は、同じ金額で多くの口数を買える時期でもあります。</p>
<div class="tbox">台風の日に畑を売らない。実がなるのは、何年も育てた木から。</div>
<div class="mbox">「お金」→「わたしの方針」に、暴落時にどうするかを<strong>平常時のうちに</strong>書いておこう。ホーム画面に毎日表示されます。</div>
<h3>取り崩しの前に</h3>
<p>使う時期が近いお金（数年以内の教育費など）は、値下がりで困らないよう、<strong>早めに預金など値動きの小さいものへ移しておく</strong>のが基本です。「いつ・いくら使うか」で、置き場所を分けます。</p>
` },
{ id:'stock1', field:'stock', icon:'🏭', title:'従業員持株会', sub:'奨励金・単元株・引き出し・注意点', gram:`
<h3>まず、これは何？</h3>
<p>[[従業員持株会]]は、社員が給料から毎月お金を出し合い、自社の株を共同で買い続ける仕組みです。会社から上乗せの[[奨励金]]が出ることが多く、ここが最大のメリットです。</p>
<div class="pbox">会社がおこづかいを足してくれる「自社株の積立」。奨励金10%なら、1万円出すと1.1万円分買える。</div>
<h3>しくみ</h3>
<ul>
<li>毎月決まった額を給料から天引き（ボーナス時に増額できる会社も）。</li>
<li>株は持株会の名前でまとめて持ち、各自は<strong>持分</strong>（口数・株数）を持つ。</li>
<li>配当は、持株会の中で<strong>再投資</strong>されるのが一般的。</li>
<li>持分が<strong>単元株（ふつう100株）</strong>以上になると、自分の証券口座へ引き出せる。</li>
</ul>
<h3>税金</h3>
<p>奨励金は<strong>給与所得</strong>として扱われ、給料と同じく税金がかかります。また、持株会で買う株は<strong>NISAの対象外</strong>です。引き出した株を、あとからNISA口座に移すこともできません。</p>
<h3>気をつけたいこと</h3>
<p>一番の注意点は<strong>集中リスク</strong>です。給料も資産も同じ会社に頼ると、会社の業績が悪いときに両方が同時に傷みます。資産全体の中で、自社株の割合に上限を決めておくと安心です。</p>
<p>もう一つは[[インサイダー取引]]規制です。持株会の<strong>毎月決まった額の買付</strong>は規制の対象外ですが、引き出した株を売るときや、拠出額を臨時に変えるときは、会社の重要な未公表情報を知っていないかに注意し、社内の規程に従います。</p>
<div class="tbox">好きな店の割引クーポン付き積立。ただし、自分の勤め先という一つのかごに、卵を全部入れないこと。</div>
<div class="mbox">持株会の毎月の拠出額と奨励金率を「お金」→「資産・積立」に登録すると、年間の奨励金の見込みと、資産全体に占める自社株の割合が自動で出ます。</div>
` },
{ id:'tax1', field:'tax', icon:'🧾', title:'年末調整のしくみと書類', sub:'4つの申告書・控除証明書・改正点', gram:`
<h3>まず、これは何？</h3>
<p>会社は毎月の給料から所得税を<strong>概算</strong>で天引きしています。1年の最後に、本当の税額を計算し直して差額を精算するのが[[年末調整]]です。多く引かれていれば12月か1月の給料で戻り、少なければ追加で引かれます。</p>
<div class="pbox">毎月の天引きは「仮払い」。年末に1年分のレシート（控除の書類）を会社に見せて、正しい金額に精算する。</div>
<h3>出す書類</h3>
<div class="tblwrap"><table><thead><tr><th>書類</th><th>中身</th></tr></thead><tbody>
<tr><td>扶養控除等（異動）申告書</td><td>扶養する家族。<strong>翌年分</strong>を年末に出す</td></tr>
<tr><td>基礎控除申告書 兼 配偶者控除等申告書 兼 所得金額調整控除申告書 兼 特定親族特別控除申告書</td><td>本人の所得見込み・配偶者・19〜22歳の子の控除（略して「基・配・所・特」）</td></tr>
<tr><td>保険料控除申告書</td><td>生命保険・地震保険・家族の分も払った社会保険料・iDeCo</td></tr>
<tr><td>住宅借入金等特別控除申告書</td><td>住宅ローン控除の2年目以降。年末残高証明書と一緒に</td></tr>
</tbody></table></div>
<h3>控除証明書は10月ごろに届く</h3>
<p>生命保険会社や損害保険会社から、<strong>控除証明書</strong>がはがきなどで届きます。年末調整で使うので、届いたらすぐ保管します。電子で受け取れる会社も増えています。</p>
<h3>生命保険料控除</h3>
<p>2012年以降の契約（新制度）では、<strong>一般・介護医療・個人年金</strong>の3つがそれぞれ最大4万円、合計で最大12万円（所得税）です。</p>
<div class="newbox">令和8年分から、<strong>23歳未満の扶養親族がいる人</strong>は、新制度の一般生命保険料控除の上限が<strong>6万円</strong>に上がりました（3つの合計上限12万円は同じ）。基礎控除は所得に応じて上乗せされ、所得489万円以下なら最大104万円に。給与所得控除の最低額も74万円になり、所得税がかかり始める年収は178万円に上がりました。改正は12月の年末調整で反映されます。</div>
<h3>家族の社会保険料も控除になる</h3>
<p>20歳を過ぎた大学生の子の<strong>国民年金保険料を親が払った</strong>場合、親の[[社会保険料控除]]にできます。年末調整では、日本年金機構の控除証明書を添付します。</p>
<div class="mbox">「お金」→「年末調整」で、今年出す書類と添付物をチェックリストで管理できます。毎年同じ時期に、同じ順番で。</div>
` },
{ id:'tax2', field:'tax', icon:'📮', title:'年末調整でできないこと', sub:'確定申告・ふるさと納税・医療費控除', gram:`
<h3>確定申告が必要な場面</h3>
<p>会社員でも、次のような控除は年末調整では受けられず、[[確定申告]]が必要です。期間はふつう<strong>2月16日〜3月15日</strong>です。</p>
<ul>
<li><strong>医療費控除</strong>（家族の分も合算できる）</li>
<li><strong>ふるさと納税</strong>（ワンストップ特例を使わない場合）</li>
<li><strong>住宅ローン控除の1年目</strong></li>
<li>雑損控除（災害・盗難）、寄附金控除（一般の寄附）</li>
</ul>
<p>税金が戻るだけの申告（還付申告）は、翌年1月1日から<strong>5年間</strong>できます。出し忘れに気づいたら、さかのぼって申告できます。</p>
<div class="pbox">年末調整は「会社がまとめてやってくれる精算」。会社が知らないこと（病院代、寄附、家を買った1年目）は、自分で税務署に伝える。それが確定申告。</div>
<h3>医療費控除</h3>
<p>1年間（1〜12月）に家族で払った医療費から、保険などで戻った分を引き、<strong>10万円</strong>（所得200万円未満の人は所得の5%）を超えた分が控除になります（上限200万円）。市販薬の購入額が1.2万円を超えた分を控除する<strong>セルフメディケーション税制</strong>もありますが、どちらか一方しか選べません。</p>
<h3>ふるさと納税</h3>
<p>[[ふるさと納税]]は、自治体に寄附すると、<strong>自己負担2,000円</strong>を除いた額が所得税・住民税から差し引かれる仕組みです。差し引かれる上限は、年収や家族構成、ほかの控除で変わります。<strong>1月1日〜12月31日</strong>の寄附が、その年の分です。</p>
<div class="tblwrap"><table><thead><tr><th>ワンストップ特例の条件</th><th>内容</th></tr></thead><tbody>
<tr><td>確定申告が不要な人</td><td>会社員で、ほかに申告する理由がない</td></tr>
<tr><td>寄附先</td><td>1年で<strong>5自治体以内</strong></td></tr>
<tr><td>期限</td><td>申請書を翌年<strong>1月10日</strong>必着</td></tr>
</tbody></table></div>
<div class="wbox">⚠️ 医療費控除などで確定申告をすると、ワンストップ特例は<strong>無効</strong>になります。そのときは、ふるさと納税も全部、確定申告に書き込みます。</div>
<p>2025年10月から、ポータルサイトが寄附に<strong>独自のポイントをつけることは禁止</strong>されました。</p>
<h3>6月の住民税決定通知書で確認</h3>
<p>ふるさと納税が住民税から引かれているかは、6月ごろに会社経由で届く<strong>住民税決定通知書</strong>の「寄附金税額控除」欄で確かめます。</p>
` },
{ id:'tax3', field:'tax', icon:'👪', title:'子どもと税金・扶養', sub:'扶養控除・特定扶養・年収の壁', gram:`
<h3>年齢で変わる扶養控除</h3>
<p>扶養控除は、子どもの<strong>その年の12月31日時点の年齢</strong>で決まります。</p>
<div class="tblwrap"><table><thead><tr><th>年齢（12/31）</th><th>所得税の控除</th><th>住民税の控除</th></tr></thead><tbody>
<tr><td>15歳以下</td><td>なし（児童手当がある）</td><td>なし</td></tr>
<tr><td>16〜18歳</td><td>38万円（一般の扶養）</td><td>33万円</td></tr>
<tr><td>19〜22歳</td><td><strong>63万円</strong>（[[特定扶養控除]]）</td><td>45万円</td></tr>
</tbody></table></div>
<p>大学生年代の19〜22歳は控除が大きくなります。高校生年代の控除を縮小する案は議論されましたが、令和8年度の改正では<strong>見送られ</strong>、38万円のままです。</p>
<h3>子どもがアルバイトで稼いだら</h3>
<p>扶養に入れられる子の所得の上限は、令和8年分から<strong>合計所得62万円以下</strong>（給与だけなら年収136万円以下）になりました。</p>
<p>19〜22歳の子は、それを超えても、合計所得123万円以下までは[[特定親族特別控除]]で、親の控除が<strong>段階的に減る</strong>形になります。急に控除がゼロになる「壁」は小さくなりました。親が年末調整で、子の<strong>年間の所得の見込み</strong>を申告します。</p>
<div class="pbox">子どもがバイトを頑張っても、親の税金が突然増える段差はゆるやかになった。ただし「見込み額」を書いて出すので、年末に子どもの年収を確認する習慣が大事。</div>
<h3>税金とは別の「社会保険の壁」</h3>
<p>健康保険で親の扶養（被扶養者）でいられるかは、税金とは<strong>別のルール</strong>です。ふつうは年収130万円未満ですが、2025年10月から<strong>19〜22歳は150万円未満</strong>に広がりました。超えると、子ども自身が国民健康保険などに入る必要があります。</p>
<div class="wbox">⚠️ 税金（所得で判定・1〜12月）と社会保険（今後1年間の見込み年収で判定）は、物差しも期間も違う。両方を確認する。</div>
<div class="mbox">「お金」→「教育資金」で子どもの生年月日を入れると、今年と来年の12月31日時点の年齢と、扶養控除の区分を自動で表示します。</div>
` },
{ id:'edu1', field:'edu', icon:'✏️', title:'大学受験のお金', sub:'受験料・入学金・初年度納付金', gram:`
<h3>受験だけでもお金がかかる</h3>
<div class="tblwrap"><table><thead><tr><th>項目</th><th>目安</th></tr></thead><tbody>
<tr><td>大学入学共通テスト</td><td>3教科以上 18,000円／2教科以下 12,000円</td></tr>
<tr><td>国公立 個別試験</td><td>17,000円</td></tr>
<tr><td>私立 一般選抜</td><td>1回 30,000〜35,000円前後（共テ利用は安め）</td></tr>
<tr><td>交通費・宿泊費</td><td>遠方受験なら1回数万円</td></tr>
</tbody></table></div>
<p>私立を何校も受けると、受験料だけで十数万円になることもあります。複数学部を同時に受けると割引になる大学もあります。</p>
<div class="tbox">受験は「入場料（受験料）」→「席の予約料（入学金）」→「1年目の利用料（授業料）」の順にお金がかかるイベント。予約料は、キャンセルしても戻らない。</div>
<h3>入学までに払うお金</h3>
<div class="tblwrap"><table><thead><tr><th></th><th>入学金</th><th>授業料（年）</th></tr></thead><tbody>
<tr><td>国立（標準額）</td><td>282,000円</td><td>535,800円</td></tr>
<tr><td>私立（平均の目安）</td><td>約24万円</td><td>約96万円＋施設費など</td></tr>
</tbody></table></div>
<p>国立でも、授業料を標準額より高く設定している大学があります。必ず志望校の募集要項で確認します。</p>
<h3>「押さえ」の入学金</h3>
<p>私立大学の入学金の締め切りは、<strong>国公立の合格発表より前</strong>に来ることが多いです。第一志望の結果を待つ間に、合格した私立の入学金を払って席を確保することを「押さえ」といいます。入学を辞退しても、入学金はふつう戻りません。<strong>授業料などは、決められた期限までに辞退すれば返還される</strong>大学が多いです。</p>
<div class="wbox">⚠️ 入学金の振込期限は、合格発表から1週間ほどのことも。土日をはさむと銀行振込が間に合わないことがある。期限はカレンダーに必ず登録する。</div>
<h3>お金の準備は「いつ・いくら」</h3>
<p>受験費用は1〜2月、入学金は2〜3月、前期授業料は3〜4月に集中します。<strong>2〜3月に最大の山</strong>が来ると考えて、その時期に使える現金を用意します。</p>
<div class="mbox">「お金」→「教育資金」に受験校を登録すると、受験料の合計、入学金の期限、合格後に必要な額、教育資金口座の残高との差を自動で計算します。</div>
` },
{ id:'edu2', field:'edu', icon:'🎒', title:'合格後のお金の使い方', sub:'奨学金・教育ローン・一人暮らし・20歳', gram:`
<h3>足りないときの2つの道</h3>
<div class="tblwrap"><table><thead><tr><th></th><th>奨学金（JASSO）</th><th>国の教育ローン</th></tr></thead><tbody>
<tr><td>借りる人</td><td><strong>学生本人</strong></td><td><strong>保護者</strong></td></tr>
<tr><td>受け取り</td><td>入学後に毎月振込</td><td>一括で受け取れる</td></tr>
<tr><td>入学金に</td><td>間に合わない</td><td>間に合う（合格前にも申込可）</td></tr>
<tr><td>金利</td><td>第一種は無利子・第二種は有利子</td><td>固定金利</td></tr>
</tbody></table></div>
<p>[[奨学金]]には返さなくていい<strong>給付型</strong>（家計の基準あり）と、返す<strong>貸与型</strong>があります。高校3年のうちに申し込む「予約採用」が基本です。貸与型の「入学時特別増額」も、振り込まれるのは<strong>入学後</strong>です。</p>
<p>[[国の教育ローン]]（日本政策金融公庫）は、学生1人あたり原則350万円まで借りられ、世帯年収の上限があります。入学金のつなぎに向いています。</p>
<div class="pbox">奨学金は「子どもの借金」、教育ローンは「親の借金」。入学前の大きな支払いは、奨学金では間に合わない。</div>
<h3>一人暮らしの初期費用</h3>
<p>敷金・礼金・仲介手数料・前家賃、家具・家電、引っ越し代で、<strong>40〜60万円前後</strong>かかることがあります。合格発表から入居まで時間が短いので、物件の見当は事前につけておきます。</p>
<h3>入学後に決めておくこと</h3>
<ul>
<li><strong>仕送り額</strong>と、アルバイト代との分担</li>
<li>学費を払う口座と、生活費の口座を分ける</li>
<li>パソコンなど指定がある物品（大学の指定を確認）</li>
<li>クレジットカードは家族カードか本人カードか</li>
</ul>
<h3>20歳になったら国民年金</h3>
<p>学生でも20歳から国民年金に加入します。収入の少ない学生は[[学生納付特例]]を申請すると、保険料の支払いが猶予されます（10年以内なら後から納められます）。猶予したままだと、将来の年金額が少なくなります。</p>
<div class="tbox">親が子の国民年金を払うと、その額は<strong>親の</strong>社会保険料控除になる。税金が少し戻る「家族の作戦」。</div>
` },
{ id:'house1', field:'house', icon:'🏠', title:'住宅ローン控除と金利', sub:'0.7%・13年・繰上返済の落とし穴', gram:`
<h3>住宅ローン控除とは</h3>
<p>[[住宅ローン控除]]は、年末のローン残高の一定割合を、所得税（引ききれない分は住民税）から差し引く制度です。2022年以降に入居した人は、控除率<strong>0.7%</strong>です。</p>
<div class="tblwrap"><table><thead><tr><th>項目</th><th>2022〜2023年入居の新築の例</th></tr></thead><tbody>
<tr><td>控除率</td><td>年末残高の0.7%</td></tr>
<tr><td>期間</td><td>13年（中古住宅は10年）</td></tr>
<tr><td>残高の上限</td><td>一般の住宅3,000万円、省エネ基準適合4,000万円、ZEH水準4,500万円、長期優良住宅5,000万円</td></tr>
<tr><td>住民税から</td><td>所得税で引ききれない分。上限は課税総所得金額等の5%（最高9.75万円）</td></tr>
<tr><td>所得の条件</td><td>合計所得2,000万円以下</td></tr>
</tbody></table></div>
<div class="pbox">ローンを借りて家を買った人へのごほうび。年末に残っている借金の0.7%ぶん、税金が安くなる。借金が減るほど、ごほうびも小さくなる。</div>
<p><strong>1年目は確定申告</strong>が必要です。2年目以降は、税務署から届く申告書と、銀行の<strong>年末残高証明書</strong>を会社に出せば、年末調整で受けられます。</p>
<h3>変動金利のしくみ</h3>
<p>変動金利は、多くの銀行で<strong>半年ごと</strong>に見直されます。元利均等返済では、金利が上がっても、返済額の変更は<strong>5年ごと</strong>、上がり幅は前の<strong>1.25倍まで</strong>とする「5年ルール・125%ルール」を設けている銀行があります。ただし、ルールがない銀行もあり、ある場合も<strong>払いきれない利息（未払利息）</strong>が出ることがあります。自分の契約書で確認しておきます。</p>
<h3>繰上返済と控除の関係</h3>
<p>繰上返済をすると、年末残高が減り、<strong>控除額も減ります</strong>。ローン金利が控除率0.7%より低い間は、借りておいたほうが手元にお金が残る「[[逆ざや]]」の状態になることがあります。金利が上がり、0.7%を超えてくると、繰上返済の効果が大きくなります。</p>
<div class="wbox">⚠️ 期間短縮型の繰上返済で、借り入れたときからの返済期間が<strong>10年未満</strong>になると、その年から控除が受けられなくなる。控除期間中の大きな繰上返済は慎重に。</div>
<h3>借り換え</h3>
<p>借り換えても、条件を満たせば控除は続けられます（新しいローンが元のローンの返済のためで、残りの返済期間が10年以上など）。控除の対象になるのは、借り換え直前の旧ローン残高までです。手数料・保証料・登記費用などの諸費用を含めて比べます。</p>
<div class="mbox">「お金」→「住宅ローン」で、年末残高と金利を記録すると、今年の控除見込み額と、控除が終わる年、金利と0.7%の比較が出ます。</div>
` },
{ id:'life1', field:'life', icon:'🛟', title:'年金・iDeCo・保険の基本', sub:'ねんきん定期便・iDeCo・保障の見直し', gram:`
<h3>公的年金は2階建て</h3>
<p>日本の公的年金は、全員が入る<strong>国民年金（1階）</strong>と、会社員などが入る<strong>厚生年金（2階）</strong>の2階建てです。自分の記録は、誕生月に届く[[ねんきん定期便]]や「ねんきんネット」で確認できます。</p>
<h3>iDeCo（個人型確定拠出年金）</h3>
<p>[[iDeCo]]は、自分で掛金を出して運用し、老後に受け取る年金です。</p>
<ul>
<li>掛金は<strong>全額が所得控除</strong>（小規模企業共済等掛金控除）。年末調整で申告できる</li>
<li>運用益は非課税</li>
<li>原則<strong>60歳まで引き出せない</strong></li>
<li>受け取るときは、退職所得控除や公的年金等控除の対象</li>
</ul>
<p>NISAはいつでも引き出せる自由なお金、iDeCoは老後専用で税金が安くなるお金、と役割を分けて考えます。掛金の上限は、勤め先の企業年金の有無などで変わり、制度の見直しも続いています。</p>
<h3>保険は「起きたら困ること」に</h3>
<p>保険は、貯金では払いきれない大きな損失に備えるものです。日本の健康保険には、医療費の自己負担に上限がある[[高額療養費制度]]があります。子どもが独立に近づくと、必要な死亡保障は小さくなっていくので、節目ごとに見直します。</p>
<div class="pbox">保険は「めったに起きないけど、起きたら家計が壊れること」にだけ使う。小さな出費は貯金で備える。</div>
` }
];

const UNITS=TS.units, UMAP=Object.fromEntries(UNITS.map(u=>[u.id,u]));
function allQ(){return TS.q.map(x=>Object.assign({k:'q'},x)).concat(TS.ox.map(x=>Object.assign({k:'ox'},x))).concat((S.customQ||[]).map(x=>Object.assign({k:x.t!=null?'ox':'q',custom:true},x)));}
let POOL=allQ();
const qField=it=>it.me?'me':(UMAP[it.u]?UMAP[it.u].field:(it.f||'life'));

function mastery(items){if(!items.length)return 0;return pct(items.filter(it=>{const s=S.srs[it.id];return s&&s.b>=3;}).length,items.length);}

/* ── お金の計算 ── */
const latestSnap=a=>{const s=(a.snaps||[]).slice().sort((x,y)=>x.d<y.d?-1:1);return s[s.length-1]||null;};
const snapAt=(a,d)=>{let r=null;for(const s of (a.snaps||[]).slice().sort((x,y)=>x.d<y.d?-1:1)){if(s.d<=d)r=s;}return r;};
function totals(){let v=0,p=0,m=0,y=0;S.accounts.forEach(a=>{const s=latestSnap(a);if(s){v+=N(s.v);p+=N(s.p||s.v);}m+=N(a.monthly);y+=N(a.monthly)*12+N(a.bonus);});return {v,p,m,y};}
function byType(){const o={};S.accounts.forEach(a=>{const s=latestSnap(a);if(!s)return;o[a.type]=(o[a.type]||0)+N(s.v);});return o;}
function nisaStat(){const Y=YEAR(),y0=(Y-1)+'-12-31';let planT=0,planG=0,bookT=0,bookG=0,yrT=0,yrG=0;
  S.accounts.forEach(a=>{if(a.type!=='nisa_t'&&a.type!=='nisa_g')return;const plan=N(a.monthly)*12+N(a.bonus);const s=latestSnap(a),s0=snapAt(a,y0);const bk=s?N(s.p||0):0;const yr=s&&s.d>y0?bk-(s0?N(s0.p||0):0):0;
    if(a.type==='nisa_t'){planT+=plan;bookT+=bk;yrT+=Math.max(0,yr);}else{planG+=plan;bookG+=bk;yrG+=Math.max(0,yr);}});
  return {planT,planG,bookT,bookG,yrT,yrG,book:bookT+bookG};}
function ageAt(birth,dateStr){if(!birth)return null;const b=parseD(birth),d=parseD(dateStr);let a=d.getFullYear()-b.getFullYear();if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;return a;}
function fuyoKbn(age){if(age==null)return '—';if(age<=15)return '扶養控除なし（児童手当）';if(age<=18)return '一般の扶養 38万円';if(age<=22)return '特定扶養 63万円';if(age<=69)return '一般の扶養 38万円（所得要件あり）';return '老人扶養';}
function loanInfo(){const L=S.loan,Y=YEAR();const mv=N(L.moveIn)||(L.start?N(L.start.slice(0,4)):0);const last=mv?mv+N(L.kYears)-1:0;
  const bals=(L.bals||[]).slice().sort((a,b)=>a.y-b.y);const bal=bals.length?N(bals[bals.length-1].bal):0;
  const rates=(L.rates||[]).slice().sort((a,b)=>a.d<b.d?-1:1);const past=rates.filter(r=>r.d<=today());const rate=past.length?N(past[past.length-1].r):(rates.length?N(rates[0].r):0);
  const active=!!(mv&&Y>=mv&&Y<=last);const ded=active?Math.min(bal,N(L.kCap)*1e4)*N(L.kRate)/100:0;return {mv,last,remain:last?last-Y+1:0,bal,rate,ded,bals,rates,active,ended:!!(last&&Y>last)};}

/* ── イベント ── */
function occurrences(from,to){const out=[];const Y0=parseD(from).getFullYear(),Y1=parseD(to).getFullYear();
  const push=(o)=>{if(o.date>=from&&o.date<=to){o.key=o.src+':'+o.ref+':'+o.date;o.done=!!S.evDone[o.key];out.push(o);}};
  TPL.forEach(t=>{const ov=S.tplOv[t.id]||{};if(ov.off)return;for(let y=Y0;y<=Y1;y++){const o={src:'tpl',ref:t.id,date:y+'-'+pad(ov.m||t.m)+'-'+pad(ov.d||t.d),title:t.t,cat:t.c,note:t.n};push(o);if(t.id.startsWith('t_nencho')&&(S.nencho[y]||{}).submit&&out.length&&out[out.length-1]===o)o.done=true;}});
  S.events.forEach(e=>{if(!e.date)return;if(e.rep){const md=e.date.slice(5);for(let y=Y0;y<=Y1;y++)if(y+'-'+md>=e.date)push({src:'u',ref:e.id,date:y+'-'+md,title:e.title,cat:e.cat||'me',note:e.note,amount:e.amount});}else push({src:'u',ref:e.id,date:e.date,title:e.title,cat:e.cat||'me',note:e.note,amount:e.amount});});
  S.children.forEach(ch=>(ch.schools||[]).forEach(sc=>{if(sc.status==='不合格'||sc.status==='辞退')return;const nm=(ch.name||'子ども')+'・'+(sc.name||'大学');
    if(sc.exam)push({src:'sc',ref:sc.id+'e',date:sc.exam,title:nm+' 試験日',cat:'edu'});
    if(sc.result)push({src:'sc',ref:sc.id+'r',date:sc.result,title:nm+' 合格発表',cat:'edu'});
    if(sc.payBy&&sc.status!=='入学手続済')push({src:'sc',ref:sc.id+'p',date:sc.payBy,title:nm+' 入学金の期限',cat:'edu',amount:sc.entry});
    if(sc.tuitBy&&(sc.status==='合格'||sc.status==='入学手続済'))push({src:'sc',ref:sc.id+'t',date:sc.tuitBy,title:nm+' 授業料などの期限',cat:'edu',amount:sc.tuit});}));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function upcoming(days){const t=today();return occurrences(addDays(t,-3),addDays(t,days)).filter(o=>!(o.done&&o.date<t));}
function soonCount(){const t=today();return occurrences(t,addDays(t,14)).filter(o=>!o.done).length;}

  <div class="unit-foot"><button class="btn p" onclick="startRun('unit','${id}')">🎯 この単元の問題（${its.length}問）</button>${pv?`<button class="btn" onclick="go('unit','${pv.id}')">‹ ${esc(pv.title)}</button>`:''}${nx?`<button class="btn" onclick="go('unit','${nx.id}')">${esc(nx.title)} ›</button>`:''}</div></div>`;}

/* ══════════ クイズ ══════════ */
function pgQuiz(){return `<div class="wrap"><h2 class="pg">🎯 クイズ</h2><div class="pg-sub">正解すると次に出るまでの間隔がのびます（1→3→7→14→30→60→120日）。間違えると翌日にもう一度。忘れかけたころに出るので、記憶が長持ちします。</div>${modeGrid()}<div class="sec-h">分野を選んで10問</div>${fieldBars()}</div>`;}
function weakItems(){return POOL.filter(it=>{const s=S.srs[it.id];return s&&s.ng>0&&s.b<=1;});}
function dailyQ(){const due=dueList();const base=due.length?due:POOL;if(!base.length)return null;const r=seedRand('d'+today())();return base[Math.floor(r*base.length)];}
let R=null;
function startRun(mode,arg){let items=[],title='';const fresh=()=>shuffle(POOL.filter(it=>!S.srs[it.id]));
  if(mode==='due'){items=shuffle(dueList()).slice(0,15);if(!items.length)items=fresh().slice(0,10);title='今日の復習';}
  else if(mode==='daily'){const d=dailyQ();items=d?[d]:[];title='きょうの1問';}
  else if(mode==='me'){items=shuffle(genMe());title='わたしの数字クイズ';}
  else if(mode==='mix'){items=shuffle(POOL).slice(0,10);title='ミックス10問';}
  else if(mode==='ox'){items=shuffle(POOL.filter(i=>i.k==='ox')).slice(0,10);title='○×スピード';}
  else if(mode==='test'){items=shuffle(POOL.filter(i=>i.k==='q')).slice(0,20);title='総合テスト20問';}
  else if(mode==='weak'){items=shuffle(weakItems()).slice(0,15);title='苦手を克服';}
  else if(mode==='keep'){items=shuffle(POOL.filter(i=>S.keep[i.id]));title='キープした問題';}
  else if(mode==='field'){items=shuffle(POOL.filter(i=>qField(i)===arg)).slice(0,10);title=TS.FIELDS[arg].n+'の10問';}
  else if(mode==='unit'){items=shuffle(POOL.filter(i=>i.u===arg));title=(UMAP[arg]||{}).title+'の問題';}
  if(!items.length){toast('出題できる問題がありません');return;}
  R={mode,arg,title,items:items.map(it=>Object.assign({},it,{ord:it.k==='q'?(it.me?it.c.map((_,k)=>k):shuffle(it.c.map((_,k)=>k))):null})),i:0,ans:[],done:false};go('run');}
function pgRun(){if(!R)return pgQuiz();const it=R.items[R.i],n=R.items.length,a=R.ans[R.i];const f=qField(it);
  let h=`<div class="qprog"><span class="qlbl">${esc(R.title)}</span><div class="qtrack"><div class="qfill" style="width:${(R.i+(a?1:0))/n*100}%"></div></div><span class="qlbl">${R.i+1} / ${n}</span></div><div class="qcard"><div class="qmeta">${chip(f)}${it.u&&UMAP[it.u]?`<span class="src">${esc(UMAP[it.u].title)}</span>`:''}${it.k==='ox'?'<span class="chip gray">○×</span>':''}</div>`;
  if(it.k==='ox'){h+=`<div class="ox-t">${gl(esc(it.t))}</div><div class="ox-btns"><button class="ox-b o ${a&&a.pick===true?'hit':''}" onclick="answer(true)" ${a?'disabled':''}>○</button><button class="ox-b x ${a&&a.pick===false?'hit':''}" onclick="answer(false)" ${a?'disabled':''}>×</button></div>`;}
  else{h+=`<div class="qq">${gl(esc(it.q))}</div><div class="choices">`;it.ord.forEach((ci,k)=>{let cls='';if(a){if(ci===it.a)cls='ok';else if(ci===a.pick)cls='ng';}
      h+=`<button class="choice ${cls}" onclick="answer(${ci})" ${a?'disabled':''}><span class="ck">${'ABCD'[k]}</span><span>${esc(it.c[ci])}</span></button>`;if(a&&it.w&&it.w[ci])h+=`<div class="cwhy"><b class="${ci===it.a?'o':'x'}">${ci===it.a?'○':'×'}</b> ${gl(esc(it.w[ci]))}</div>`;});h+=`</div>`;}
  h+=`</div>`;
  if(a){const s=S.srs[it.id];h+=`<div class="fb ${a.ok?'ok':'ng'}"><div class="fb-h">${a.ok?'⭕ 正解！':'❌ 不正解'}${it.k==='ox'?'　正解は「'+(it.a?'○':'×')+'」':''}</div><div class="fb-body">${gl(esc(it.e||''))}${plainHTML(it.id)}</div>${s?`<div class="srs">次にこの問題が出るのは ${s.due===addDays(today(),1)?'明日':fmtYMD(s.due)}（${INT[s.b]}日後）</div>`:''}</div>
    <div class="qnav">${it.me?'':`<button class="keepbtn ${S.keep[it.id]?'on':''}" onclick="toggleKeep('${it.id}')">📌 ${S.keep[it.id]?'キープ中':'キープ'}</button>`}${it.u&&UMAP[it.u]?`<button class="btn sm" onclick="openUnitModal('${it.u}')">📚 解説を読む</button>`:''}<span class="spacer"></span><button class="btn p" onclick="nextQ()">${R.i+1<n?'次の問題 ›':'結果を見る ›'}</button></div>`;}
  else h+=`<div class="qnav"><button class="btn sm" onclick="if(confirm('中断しますか？'))go('quiz')">中断</button></div>`;return h;}
function answer(pick){const it=R.items[R.i];if(R.ans[R.i])return;const ok=it.k==='ox'?pick===it.a:pick===it.a;R.ans[R.i]={pick,ok};
  const s=S.srs[it.id]||{b:0,ok:0,ng:0};if(ok){s.b=Math.min(s.b+1,INT.length-1);s.ok++;}else{s.b=0;s.ng++;}s.due=addDays(today(),INT[s.b]);s.last=today();S.srs[it.id]=s;
  S.xp+=ok?10:2;S.days[today()]=(S.days[today()]||0)+1;save();render();}
function nextQ(){if(R.i+1<R.items.length){R.i++;render();$('content').scrollTop=0;}else{const ok=R.ans.filter(a=>a&&a.ok).length;S.hist.unshift({d:today(),t:R.title,n:R.items.length,ok});S.hist=S.hist.slice(0,200);save();go('result');}}
function toggleKeep(id){S.keep[id]=!S.keep[id];save();render();}
function openUnitModal(u){const x=UMAP[u];openModal(x.icon+' '+x.title,`<div class="gram">${glink(x.gram)}</div>`);enhancePlain($('modal-body'));}
function pgResult(){if(!R)return pgQuiz();const n=R.items.length,ok=R.ans.filter(a=>a&&a.ok).length,p=pct(ok,n),pass=R.mode==='test'?p>=80:p>=70;
  let h=`<div class="result-badge ${pass?'pass':'fail'}"><div class="rb-big">${ok} / ${n}</div><div class="rb-sub">${esc(R.title)} ・ 正答率 ${p}% ${R.mode==='test'?(pass?'・合格！':'・合格まであと少し'):''}</div></div>`;
  h+=R.items.map((it,k)=>{const a=R.ans[k]||{};return `<div class="rev-item ${a.ok?'ok':'no'}">${chip(qField(it))}<div class="rq">${esc(it.q||it.t)}</div><div class="rl">${a.ok?'<span style="color:var(--green);font-weight:600">正解</span>':'<span style="color:var(--red);font-weight:600">不正解</span>'} ・ 答え：${esc(it.k==='ox'?(it.a?'○':'×'):it.c[it.a])}</div></div>`;}).join('');
  h+=`<div class="qnav"><button class="btn" onclick="go('home')">ホームへ</button><span class="spacer"></span><button class="btn p" onclick="startRun('${R.mode}'${R.arg?`,'${R.arg}'`:''})">もう一度</button></div>`;return h;}

/* ── わたしの数字クイズ（登録データから自動生成） ── */
function niceRound(v){if(v>=1e6)return Math.round(v/1e5)*1e5;if(v>=1e5)return Math.round(v/1e4)*1e4;if(v>=1e4)return Math.round(v/1e3)*1e3;if(v>=1000)return Math.round(v/500)*500;return Math.round(v);}
function numQ(id,q,v,fmt,e){if(!v)return null;const set=new Set([v]);[0.5,0.75,1.25,1.5,2,0.6,1.4].forEach(m=>{if(set.size<4){const x=niceRound(v*m);if(x>0&&!set.has(x))set.add(x);}});
  const c=[...set].slice(0,4).sort((a,b)=>a-b);return {id,me:true,k:'q',q,c:c.map(fmt),a:c.indexOf(v),e};}
function genMe(){const out=[];const T=totals();
  S.accounts.forEach(a=>{if(N(a.monthly)>0)out.push(numQ('me_m_'+a.id,`「${a.name}」の毎月の積立額は？`,N(a.monthly),yen,`毎月 ${yen(N(a.monthly))}、年間 ${man(N(a.monthly)*12+N(a.bonus))}。`));
    if(a.type==='mochikabu'&&N(a.rate)>0&&N(a.monthly)>0){const y=Math.round((N(a.monthly)*12+N(a.bonus))*N(a.rate)/100);out.push(numQ('me_r_'+a.id,`「${a.name}」の奨励金、1年間の見込みは？（奨励金率${a.rate}%）`,y,yen,'拠出額×奨励金率。奨励金は給与所得として課税される。'));}});
  if(T.m>0&&S.accounts.filter(a=>N(a.monthly)>0).length>1)out.push(numQ('me_mt','毎月の積立の合計は？',T.m,yen,`年間では約${man(T.y)}。`));
  const ns=nisaStat();if(ns.book>0){const rem=Math.max(0,18e6-ns.book);out.push(numQ('me_nl','NISA生涯枠（1,800万円）の残りは、簿価ベースで約いくら？',niceRound(rem),man,'生涯枠は買付金額（簿価）で数える。売ると翌年に復活。'));}
  if(ns.planT>0)out.push(numQ('me_nt','今年のNISAつみたて投資枠の使用予定（毎月×12＋ボーナス）は？',ns.planT,man,'つみたて投資枠の年間上限は120万円。'));
  const own=byType().mochikabu||0;if(own&&T.v&&pct(own,T.v)>=1){const p=pct(own,T.v);const c=[...new Set([p,Math.max(1,p-10),p+10,p+20].map(x=>Math.min(99,x)))].slice(0,4).sort((a,b)=>a-b);if(c.length===4)out.push({id:'me_own',me:true,k:'q',q:'資産全体に占める持株会（自社株）の割合は？',c:c.map(x=>x+'%'),a:c.indexOf(p),e:`方針の上限は${S.policy.ownmax||'—'}%。集中しすぎていないか定期的に確認。`});}
  const L=loanInfo();if(L.last){const c=[L.last-2,L.last-1,L.last,L.last+2];out.push({id:'me_ll',me:true,k:'q',q:'住宅ローン控除は何年分まで受けられる？',c:c.map(y=>y+'年分'),a:2,e:`${L.mv}年入居・${S.loan.kYears}年間で ${L.last}年分まで（あと${Math.max(0,L.remain)}年）。`});}
  if(L.rate){const r=L.rate;const c=[r,+(r+0.25).toFixed(3),+(Math.max(0.1,r-0.25)).toFixed(3),+(r+0.5).toFixed(3)].sort((a,b)=>a-b);out.push({id:'me_lr',me:true,k:'q',q:'いまの住宅ローン金利は？',c:c.map(x=>x+'%'),a:c.indexOf(r),e:`控除率${S.loan.kRate}%と比べて、金利が${r<S.loan.kRate?'低い（逆ざや）':'高い'}状態。`});}
  if(L.ded>0)out.push(numQ('me_ld','今年の住宅ローン控除の見込み額（最新の年末残高×控除率）は？',Math.round(L.ded),yen,'所得税から引ききれない分は住民税から（上限あり）。'));
  const nx=occurrences(today(),addDays(today(),120)).filter(o=>!o.done&&o.src!=='tpl')[0];if(nx){const c=[-7,-3,0,7].map(k=>addDays(nx.date,k));out.push({id:'me_ev',me:true,k:'q',q:`「${nx.title}」はいつ？`,c:c.map(fmtYMD),a:2,e:`${fmtYMD(nx.date)}。カレンダーで完了チェックを。`});}
  S.children.forEach(ch=>{if(!ch.birth)return;const age=ageAt(ch.birth,(YEAR()+1)+'-12-31');const opts=['扶養控除なし（児童手当）','一般の扶養 38万円','特定扶養 63万円','老人扶養'];const ans=fuyoKbn(age);const ai=opts.indexOf(ans);if(ai>=0)out.push({id:'me_fy_'+ch.id,me:true,k:'q',q:`${ch.name||'子ども'}の、来年（${YEAR()+1}年）の扶養控除の区分は？（所得税）`,c:opts,a:ai,e:`${YEAR()+1}年12月31日時点で${age}歳。扶養控除等申告書（翌年分）に反映する。`});
    (ch.schools||[]).forEach(sc=>{if(sc.payBy&&sc.status!=='不合格'&&sc.status!=='辞退'&&sc.status!=='入学手続済'){const c=[-3,0,3,7].map(k=>addDays(sc.payBy,k));out.push({id:'me_sp_'+sc.id,me:true,k:'q',q:`${sc.name}の入学金の振込期限は？`,c:c.map(fmtYMD),a:1,e:`${fmtYMD(sc.payBy)}（${yen(N(sc.entry))}）。土日・銀行の締め時間に注意。`});}});});
  if(S.policy.crash){const d=['すぐに全部売って現金にする','積立をいったん止めて様子を見る','SNSで話題の銘柄に乗り換える'];const c=shuffle([S.policy.crash.slice(0,80)].concat(d));out.push({id:'me_pc',me:true,k:'q',q:'暴落したとき、わたしが決めていた行動は？',c,a:c.indexOf(S.policy.crash.slice(0,80)),e:'平常時に決めた約束を、慌てたときに思い出せるように。'});}
  furuMe(out);
  return out.filter(Boolean).filter(q=>q.a>=0);}

/* ══════════ お金 ══════════ */
function pgMoney(tab){tab=tab||'assets';const tabs=[['assets','💰 資産・積立'],['nisa','🌱 NISA'],['loan','🏠 住宅ローン'],['edu','🎓 教育資金'],['nencho','🧾 年末調整'],['policy','🧭 方針']];
  const body={assets:mAssets,nisa:mNisa,loan:mLoan,edu:mEdu,nencho:mNencho,policy:mPolicy}[tab]();

/* 資産 */
function mAssets(){const T=totals(),bt=byType(),own=bt.mochikabu||0;let h='';
  if(!S.accounts.length)return `<div class="empty">まだ口座がありません。<br>よく使う口座をまとめて追加するか、1つずつ登録してください。<div class="row" style="justify-content:center;margin-top:12px"><button class="btn g" onclick="quickSetup()">🧱 よく使う口座をまとめて追加</button><button class="btn" onclick="editAcc()">＋ 1つずつ登録</button></div></div>`;
  const pl=T.v-T.p;
  h+=`<div class="stat3"><div class="stat hl"><div class="l">総資産（評価額）</div><div class="v">${man(T.v)}</div><div class="s">元本 ${man(T.p)}</div></div><div class="stat"><div class="l">評価損益</div><div class="v ${pl>=0?'pl-p':'pl-m'}">${pl>=0?'+':''}${man(pl)}</div><div class="s">${T.p?(pl>=0?'+':'')+(pl/T.p*100).toFixed(1)+'%':''}</div></div><div class="stat"><div class="l">毎月の積立</div><div class="v">${man(T.m)}</div><div class="s">年 ${man(T.y)}</div></div></div>`;
  if(T.v){const ord=Object.keys(TYPES).filter(k=>bt[k]>0);h+=`<div class="sec-h">資産の内訳</div><div class="card"><div class="stack" role="img" aria-label="資産の内訳">${ord.map(k=>`<i style="width:${bt[k]/T.v*100}%;background:${TYPES[k].col}" title="${TYPES[k].n} ${man(bt[k])}"></i>`).join('')}</div><div class="legend">${ord.map(k=>`<span><i style="background:${TYPES[k].col}"></i>${TYPES[k].s} <b class="num">${man(bt[k])}</b> <span class="muted">${pct(bt[k],T.v)}%</span></span>`).join('')}</div>`;
    if(own){const p=pct(own,T.v),mx=N(S.policy.ownmax)||20;h+=`<div class="muted" style="margin-top:10px">${p>mx?'⚠️ ':''}持株会（自社株）の割合 <b>${p}%</b>（方針の上限 ${mx}%）${p>mx?' — 上限を超えています。分散を検討。':''}</div>`;}h+=`</div>`;}
  const pts=assetSeries();if(pts.length>=2)h+=`<div class="sec-h">資産の推移</div><div class="card">${lineChart('ch1',pts)}</div>`;
  h+=`<div class="sec-h">口座と積立<span class="r"><button class="btn xs" onclick="recordAll()">📝 まとめて記録</button> <button class="btn xs p" onclick="editAcc()">＋ 口座</button></span></div>`;
  S.accounts.forEach(a=>{const s=latestSnap(a),t=TYPES[a.type]||TYPES.other;const v=s?N(s.v):0,p=s?N(s.p||s.v):0,d=v-p;
    const ex=a.type==='mochikabu'&&N(a.rate)?` ・ 奨励金${a.rate}%（年 ${yen((N(a.monthly)*12+N(a.bonus))*N(a.rate)/100)}）`:'';
    h+=`<div class="acc"><span class="sw" style="background:${t.col}"></span><div><div class="a-n">${esc(a.name)} <span class="chip gray">${t.s}</span></div><div class="a-s">毎月 ${a.monthly?yen(N(a.monthly)):'—'}${N(a.bonus)?' ・ ボーナス等 年'+yen(N(a.bonus)):''}${ex}${a.start?' ・ '+esc(a.start)+'〜':''}</div><div class="a-s">${s?'記録 '+fmtYMD(s.d):'未記録'}${a.note?' ・ '+esc(a.note):''}</div></div><div class="a-v">${s?`<b>${man(v)}</b><span class="${d>=0?'pl-p':'pl-m'}">${d>=0?'+':''}${man(d)}</span>`:'<span class="muted">—</span>'}<div class="row a-act" style="justify-content:flex-end;gap:6px;margin-top:6px"><button class="btn xs p" onclick="addSnap('${a.id}')">記録</button><button class="btn xs" onclick="accHist('${a.id}')">履歴</button><button class="btn xs" onclick="editAcc('${a.id}')">編集</button></div></div></div>`;});
  return h;}
function quickSetup(){const tp=[['NISA つみたて投資枠','nisa_t'],['NISA 成長投資枠','nisa_g'],['従業員持株会','mochikabu'],['教育資金（預金）','edu'],['生活防衛資金（預金）','deposit']];

function saveAcc(id){const o={name:V('a_name')||'口座',type:V('a_type'),monthly:N(V('a_mon')),bonus:N(V('a_bon')),rate:V('a_rate'),start:V('a_start'),note:V('a_note')};

/* 折れ線（評価額）＋元本の点線。ホバーで値を表示 */
window._ch={};
function lineChart(id,pts){const W=760,H=240,L=70,Rr=14,Tp=14,B=30;const vs=pts.flatMap(p=>[p.v,p.p]);let mx=Math.max(...vs),mn=Math.min(...vs);if(mx===mn){mx*=1.1;mn*=0.9;}const pad2=(mx-mn)*0.08;mx+=pad2;mn=Math.max(0,mn-pad2);
  const x=i=>L+(pts.length===1?0:i*(W-L-Rr)/(pts.length-1)),y=v=>Tp+(H-Tp-B)*(1-(v-mn)/(mx-mn));
  const line=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
  let g='';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border-soft)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="var(--text-muted)">${man(v)}</text>`;}
  const lbl=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  lbl.forEach(i=>{g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="13" fill="var(--text-muted)">${fmtYMD(pts[i].d)}</text>`;});
  const area=line('v')+` L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B} Z`;
  const hits=pts.map((p,i)=>{const w=(W-L-Rr)/Math.max(1,pts.length-1);return `<rect x="${x(i)-w/2}" y="${Tp}" width="${w}" height="${H-Tp-B}" fill="transparent" data-i="${i}"/>`;}).join('');
  window._ch[id]={pts,x,y};
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="資産の推移">${g}<path d="${area}" fill="var(--accent)" opacity=".07"/><path d="${line('p')}" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="5 4"/><path d="${line('v')}" fill="none" stroke="var(--accent)" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}<line class="xh" x1="0" x2="0" y1="${Tp}" y2="${H-B}" stroke="var(--text-muted)" stroke-dasharray="3 3" opacity="0"/>${hits}</svg><div class="tip"></div></div>
  <div class="legend"><span><i style="background:var(--accent)"></i>評価額</span><span><i style="background:var(--text-muted)"></i>元本（点線）</span></div>`;}
function bindCharts(){Object.keys(window._ch).forEach(id=>{const el=$(id);if(!el)return;const C=window._ch[id],tip=el.querySelector('.tip'),xh=el.querySelector('.xh'),svg=el.querySelector('svg');
  const show=i=>{const p=C.pts[i];const r=svg.getBoundingClientRect(),sc=r.width/760;tip.innerHTML=`${fmtYMD(p.d)}<br>評価額 <b>${man(p.v)}</b><br>元本 ${man(p.p)}`;tip.style.left=(C.x(i)*sc)+'px';tip.style.top=(C.y(p.v)*sc)+'px';tip.classList.add('show');xh.setAttribute('x1',C.x(i));xh.setAttribute('x2',C.x(i));xh.setAttribute('opacity','1');};
  el.querySelectorAll('rect[data-i]').forEach(rc=>{const i=+rc.dataset.i;rc.addEventListener('mouseenter',()=>show(i));rc.addEventListener('touchstart',()=>show(i),{passive:true});});
  svg.addEventListener('mouseleave',()=>{tip.classList.remove('show');xh.setAttribute('opacity','0');});});}

function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tsumiki_backup_'+today()+'.json';a.click();toast('バックアップを保存しました');}
function importText(){const t=V('imp-txt');if(!t){toast('貼り付けてください');return;}loadBackup(t);}
function loadBackup(txt){try{const d=JSON.parse(txt.trim().replace(/^\uFEFF/,''));if(!d||!d.v)throw 0;if(!confirm('今のデータを、このバックアップで置き換えますか？'))return;localStorage.setItem(KEY,JSON.stringify(d));S=load();applyTheme&&applyTheme();RT={n:'home'};render();toast('読み込みました 🧱');}catch(e){toast('読み込めませんでした。{ から } まで全部コピーされているか確認');}}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadBackup(String(r.result));r.readAsText(f);}
function addCQ(){const m=$('cq-msg');try{let a=JSON.parse(V('cq'));if(!Array.isArray(a))a=[a];const ids=new Set(allQ().map(x=>x.id));let n=0,bad=[];a.forEach((x,i)=>{const ok=x&&x.id&&!ids.has(x.id)&&((x.q&&Array.isArray(x.c)&&x.c.length>=2&&Number.isInteger(x.a)&&x.a<x.c.length)||(x.t&&typeof x.a==='boolean'));if(ok){S.customQ.push(x);ids.add(x.id);n++;}else bad.push(i+1);});save();m.className='imp-msg ok';m.textContent=n+'問を追加しました。'+(bad.length?'\n形式エラー・ID重複でスキップ：'+bad.join(', ')+'番目':'');POOL=allQ();renderSide();}catch(e){m.className='imp-msg err';m.textContent='JSONの形式が正しくありません。';}}

const RATES=[5,10,20,23,33,40,45];
const OS_ST=['未申請','申請済','確定申告で'];
function furuData(){S.furu=S.furu||{base:{},list:[]};S.furu.base=S.furu.base||{};S.furu.list=S.furu.list||[];return S.furu;}
function furuBase(y){const F=furuData();return F.base[y]||F.base[y-1]||null;}
function furuLimit(y){const b=furuBase(y);if(!b||!N(b.shotoku)||!N(b.rate))return 0;return Math.floor(N(b.shotoku)*0.2/(0.9-N(b.rate)/100*1.021))+2000;}
function furuStat(y){const L=furuData().list.filter(x=>String(x.date||'').startsWith(String(y)));const total=L.reduce((s,x)=>s+N(x.amt),0);const cities=[...new Set(L.map(x=>(x.city||'').trim()).filter(Boolean))];
  return {L,total,cities,pending:L.filter(x=>(x.os||'未申請')==='未申請'),noCert:L.filter(x=>!x.cert),lim:furuLimit(y)};}

  if(lim)h+=meterHTML(Math.min(st.total,lim),lim,st.total>lim?'var(--red)':'var(--f-furu)','上限の目安に対する寄附');
  if(mustFile)h+=`<div class="wbox">⚠️ ${Y}年は <b>${st.cities.length}自治体</b>。ワンストップ特例（5自治体まで）は使えません。翌年2/16〜3/15に<b>確定申告</b>で、全部の寄附を申告します。</div>`;
  else if(st.pending.length)h+=`<div class="nbox">📮 ワンストップの申請がまだ <b>${st.pending.length}件</b>。${Y+1}年1月10日必着です。</div>`;
  h+=`<div class="sec-h">寄附の記録<span class="r"><button class="btn xs p" onclick="editFuru()">＋ 寄附を記録</button></span></div>`;
  h+=st.L.length?st.L.slice().sort((a,b)=>a.date<b.date?-1:1).map(x=>`<div class="school"><div class="sh"><span class="sn" onclick="editFuru('${x.id}')" style="cursor:pointer">${esc(x.city)}</span><b class="num">${yen(N(x.amt))}</b></div><div class="muted" style="margin:2px 0 8px">${fmtYMD(x.date)}${x.gift?' ・ '+esc(x.gift):''}${x.recv?' ・ 届いた✓':''}</div><div class="row" style="gap:8px"><select class="st-sel" onchange="setFuru('${x.id}','os',this.value)">${OS_ST.map(s=>`<option ${s===(x.os||'未申請')?'selected':''}>${s}</option>`).join('')}</select><button class="btn xs ${x.cert?'p':''}" onclick="setFuru('${x.id}','cert',${!x.cert})">${x.cert?'✓ 受領証明書あり':'受領証明書 未'}</button><button class="btn xs" onclick="editFuru('${x.id}')">編集</button></div></div>`).join(''):'<div class="empty">寄附したら、ここに記録。合計・自治体の数・ワンストップの申請状況を自動で管理します。</div>';
  h+=`<div class="sec-h">上限の目安を計算</div><div class="card"><p class="muted" style="margin-bottom:10px">6月ごろ会社から届く<b>住民税決定通知書</b>の「所得割額」（市民税＋県民税の合計）と、自分の<b>所得税率</b>を入れます。上限 ＝ 所得割額×20% ÷（90% − 所得税率×1.021）＋2,000円。</p>
  <div class="fm">${fld('fb_s','住民税所得割額（円）',b.shotoku||'','number','例：300000')}${sel('fb_r','所得税率',[['','わからない']].concat(RATES.map(r=>[r,r+'%'])),b.rate||'')}</div>
  <p class="muted" style="margin-top:8px">所得税率の目安（課税所得）：195万円以下5%／330万円以下10%／695万円以下20%／900万円以下23%。源泉徴収票の「給与所得控除後の金額」から「所得控除の額の合計額」を引いたのが課税所得です。</p>
  <div class="fm-act"><button class="btn p" onclick="saveFuruBase(${Y})">${Y}年分として保存</button></div>
  <div class="muted">扶養が増える・医療費控除やiDeCoが増える年は、上限が下がります。上限いっぱいではなく、1〜2割の余裕を残すのが安全です。</div></div>
  <div class="row" style="margin-top:16px"><button class="btn sm" onclick="go('unit','furu1')">📚 しくみ</button><button class="btn sm" onclick="go('unit','furu2')">📚 手続きと1年の流れ</button><button class="btn sm" onclick="startRun('field','furu')">🎯 問題</button><a class="btn sm" href="${LINKS.furu[1]}" target="_blank" rel="noopener">🔗 総務省</a></div>`;
  return h;}
function saveFuruBase(y){const F=furuData();F.base[y]={shotoku:N(V('fb_s')),rate:N(V('fb_r'))};save();toast(furuLimit(y)?'上限の目安：'+yen(furuLimit(y)):'保存しました');render();}
function editFuru(id){const x=furuData().list.find(v=>v.id===id)||{date:today(),city:'',amt:'',gift:'',os:'未申請',cert:false,recv:false,memo:''};

function saveFuru(id){const F=furuData();const o={date:V('fu_d')||today(),city:V('fu_c')||'自治体',amt:N(V('fu_a')),gift:V('fu_g'),os:V('fu_o'),recv:V('fu_r')==='1',memo:V('fu_m')};
